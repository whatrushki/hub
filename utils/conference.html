<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DROPCONF // P2P Видеоконференции</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../libs/css/p2p-ui.css">
    <link rel="stylesheet" href="../libs/css/theme-cartoon.css" id="themeStylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../libs/code/p2p-net.js"></script>
</head>

<body>
    <div class="p2p-toast" id="toast">Уведомление</div>

    <div class="p2p-app wide" id="reactionContainer" style="height: calc(100vh - 32px); max-height: 860px;">
        <header class="p2p-header">
            <div class="p2p-logo">🎥 DROPCONF</div>
            <div class="p2p-header-actions">
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnLogToggle">📜 Лог</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnSoundToggle">🔊 Вкл</button>
                <div class="p2p-badge p2p-badge-waiting" id="netBadge">🟡 СЕТЬ...</div>
            </div>
        </header>

        <!-- 1. LOBBY -->
        <div class="p2p-card" id="lobbyScreen" style="height: 100%;">
            <div class="p2p-grid-2col" style="height: 100%;">
                <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                    <div class="p2p-video-card mirrored" style="width: 100%; aspect-ratio: 4/3;">
                        <video id="previewVideo" autoplay playsinline muted></video>
                        <div id="previewAvatar" style="position: absolute; font-size: 64px; display: none;">😎</div>
                    </div>
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <button class="p2p-btn p2p-btn-warning" id="btnTogglePreviewMic">🎤 Микрофон</button>
                        <button class="p2p-btn p2p-btn-warning" id="btnTogglePreviewCam">📷 Камера</button>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px; justify-content: center;">
                    <div>
                        <div
                            style="font-size: 12px; font-weight: 700; color: var(--p2p-text-muted); margin-bottom: 4px;">
                            ТВОЁ ИМЯ:</div>
                        <input type="text" class="p2p-input" id="inputUserName" placeholder="Например: Кот-Кодер"
                            maxlength="15">
                    </div>
                    <div class="p2p-divider"></div>
                    <button class="p2p-btn p2p-btn-success" id="btnCreateRoom">🚀 Создать новую комнату</button>
                    <div style="text-align: center; font-weight: 800; font-size: 12px; color: var(--p2p-text-muted);">
                        ИЛИ ПОДКЛЮЧИТЬСЯ</div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" class="p2p-input p2p-input-code" id="inputRoomCode" placeholder="КОД"
                            maxlength="5">
                        <button class="p2p-btn p2p-btn-info" id="btnJoinRoom"
                            style="width: auto; padding: 0 20px;">Войти</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. CONFERENCE -->
        <div id="conferenceScreen" class="p2p-hidden"
            style="display: flex; flex-direction: column; gap: 10px; height: 100%; flex: 1; overflow: hidden; padding-bottom: 6px;">
            <div style="display: flex; gap: 12px; flex: 1; overflow: hidden; position: relative; padding-bottom: 4px;">
                <div class="p2p-video-grid" id="videoGrid" style="flex: 1; overflow-y: auto;">
                    <div class="p2p-video-card mirrored" id="myVideoCard">
                        <video id="localVideo" autoplay playsinline muted></video>
                        <div id="myAvatar" style="position: absolute; font-size: 54px; display: none;">😎</div>
                        <div
                            style="position: absolute; bottom: 10px; left: 10px; background: rgba(34, 47, 62, 0.85); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; border: 1.5px solid #fff; display: flex; align-items: center; gap: 6px; z-index: 10;">
                            <span id="myTagMic">🎤</span>
                            <span id="myTagName">Вы</span>
                        </div>
                    </div>
                </div>

                <!-- Chat Panel -->
                <div class="p2p-card p2p-hidden" id="chatPanel"
                    style="width: 310px; padding: 0; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 4px;">
                    <div
                        style="padding: 10px 14px; background: var(--p2p-surface-muted); font-weight: 800; font-size: 13px; border-bottom: 2px solid var(--p2p-border); display: flex; justify-content: space-between;">
                        <span>💬 P2P ЧАТ</span>
                        <span style="cursor: pointer;" id="btnCloseChat">✖</span>
                    </div>
                    <div id="chatMessages"
                        style="flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                    </div>
                    <div
                        style="padding: 8px 10px; border-top: 2.5px solid var(--p2p-border); display: flex; gap: 6px; background: #fff; align-items: center;">
                        <input type="text" id="inputChatMessage" class="p2p-input"
                            style="padding: 8px 12px; font-size: 13px;" placeholder="Сообщение...">
                        <button class="p2p-btn p2p-btn-success p2p-btn-icon" id="btnSendChat">➤</button>
                    </div>
                </div>
            </div>

            <!-- Controls bar & Reactions -->
            <div
                style="position: relative; display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
                <div class="p2p-card p2p-hidden" id="reactionBar"
                    style="position: absolute; bottom: 72px; padding: 8px 12px; display: flex; gap: 8px; z-index: 100;">
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="👍">👍</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="❤️">❤️</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="😂">😂</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="🔥">🔥</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="🎉">🎉</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="👏">👏</button>
                </div>

                <div class="p2p-header" style="gap: 10px; margin-bottom: 6px;">
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnMicToggle" title="Микрофон"
                        style="font-size: 20px; width: 44px; height: 44px;">🎤</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnCamToggle" title="Камера"
                        style="font-size: 20px; width: 44px; height: 44px;">📷</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnScreenShare" title="Экран"
                        style="font-size: 20px; width: 44px; height: 44px;">🖥️</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnReactionToggle" title="Реакции"
                        style="font-size: 20px; width: 44px; height: 44px;">🎉</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnChatToggle" title="Чат"
                        style="font-size: 20px; width: 44px; height: 44px;">💬</button>
                    <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnInviteInfo" title="Пригласить"
                        style="font-size: 20px; width: 44px; height: 44px;">🔗</button>
                    <button class="p2p-btn p2p-btn-danger" id="btnLeaveCall" style="width: auto; padding: 0 16px;">🔴
                        Выйти</button>
                </div>
            </div>
        </div>

        <!-- Invite Modal -->
        <div class="p2p-modal-backdrop p2p-hidden" id="inviteModal">
            <div class="p2p-modal">
                <div style="font-size: 18px; font-weight: 900; color: var(--p2p-color-primary);">ПРИГЛАСИТЬ В КОМНАТУ
                </div>
                <div style="font-size: 26px; font-weight: 900; letter-spacing: 3px; color: var(--p2p-color-info); margin: 6px 0;"
                    id="modalRoomCode">...</div>
                <div id="modalQrCode" style="display: flex; justify-content: center; margin-bottom: 8px;"></div>
                <button class="p2p-btn p2p-btn-warning" id="btnCopyInviteLink" style="margin-bottom: 6px;">📋 Копировать
                    ссылку</button>
                <button class="p2p-btn p2p-btn-info" id="btnCloseInviteModal">Закрыть</button>
            </div>
        </div>

        <!-- LOG CONSOLE -->
        <div class="p2p-card p2p-hidden" id="logConsole"
            style="background: #222f3e; color: #1dd1a1; font-family: monospace; font-size: 11px; padding: 10px 14px; max-height: 100px; overflow-y: auto; user-select: text;">
            LOG: DROPCONF готов к работе...
        </div>
    </div>

    <script>
        const AudioFX = {
            ctx: null, muted: false,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playPop() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playJoin() {
                if (this.muted || !this.ctx) return;
                [440, 554.37, 659.25].forEach((f, i) => setTimeout(() => {
                    if (this.muted || !this.ctx) return;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.2);
                }, i * 70));
            },
            playMsg() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
        };
        window.addEventListener('click', () => AudioFX.init(), { once: true });

        const logConsole = document.getElementById('logConsole');
        document.getElementById('btnLogToggle').onclick = () => logConsole.classList.toggle('p2p-hidden');
        function sysLog(text) {
            const time = new Date().toTimeString().split(' ')[0];
            logConsole.innerHTML = `[${time}] ${text}<br>` + logConsole.innerHTML;
        }

        const net = new P2PNet({ appPrefix: 'dropconf', mode: 'mesh' });

        let myName = "Участник";
        let isCamOn = true, isMicOn = true;
        let screenStream = null;

        const toast = document.getElementById('toast');
        const netBadge = document.getElementById('netBadge');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const conferenceScreen = document.getElementById('conferenceScreen');
        const previewVideo = document.getElementById('previewVideo');
        const previewAvatar = document.getElementById('previewAvatar');
        const inputUserName = document.getElementById('inputUserName');
        const inputRoomCode = document.getElementById('inputRoomCode');
        const myVideoCard = document.getElementById('myVideoCard');
        const localVideo = document.getElementById('localVideo');
        const myAvatar = document.getElementById('myAvatar');
        const myTagName = document.getElementById('myTagName');
        const myTagMic = document.getElementById('myTagMic');
        const videoGrid = document.getElementById('videoGrid');
        const btnMicToggle = document.getElementById('btnMicToggle');
        const btnCamToggle = document.getElementById('btnCamToggle');
        const btnScreenShare = document.getElementById('btnScreenShare');
        const btnReactionToggle = document.getElementById('btnReactionToggle');
        const reactionBar = document.getElementById('reactionBar');
        const btnChatToggle = document.getElementById('btnChatToggle');
        const chatPanel = document.getElementById('chatPanel');
        const chatMessages = document.getElementById('chatMessages');
        const inputChatMessage = document.getElementById('inputChatMessage');

        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }

        async function initPreview() {
            try {
                const stream = await net.startMedia({ video: true, audio: true });
                previewVideo.srcObject = stream;
                localVideo.srcObject = stream;
            } catch (e) {
                sysLog("Камера/микрофон недоступны: " + e.message);
                isCamOn = false; isMicOn = false;
                previewAvatar.style.display = 'block'; myAvatar.style.display = 'block';
            }
        }

        document.getElementById('btnTogglePreviewCam').onclick = () => {
            if (!net.localStream) return;
            isCamOn = !isCamOn;
            net.localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
            previewVideo.style.display = isCamOn ? 'block' : 'none';
            previewAvatar.style.display = isCamOn ? 'none' : 'block';
        };

        document.getElementById('btnTogglePreviewMic').onclick = () => {
            if (!net.localStream) return;
            isMicOn = !isMicOn;
            net.localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
            myTagMic.textContent = isMicOn ? '🎤' : '🔇';
        };

        document.getElementById('btnCreateRoom').onclick = async () => {
            AudioFX.playPop();
            prepareJoin();
            try {
                const code = await net.createRoom();
                sysLog(`Хост онлайн: ${code}`);
                netBadge.innerHTML = `🟢 КОМНАТА: ${code}`;
                netBadge.className = "p2p-badge p2p-badge-online";
                showToast("Комната создана!");
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        };

        document.getElementById('btnJoinRoom').onclick = () => {
            AudioFX.playPop();
            const code = inputRoomCode.value.trim();
            if (code.length < 3) return showToast("Введите код!");
            prepareJoin();
            net.joinRoom(code, { name: myName }).catch(err => {
                alert("Не удалось войти в конференцию");
                location.reload();
            });
        };

        function prepareJoin() {
            myName = inputUserName.value.trim() || ("Кот-" + Math.floor(Math.random() * 900 + 100));
            myTagName.textContent = myName + " (Вы)";
            lobbyScreen.classList.add('p2p-hidden');
            conferenceScreen.classList.remove('p2p-hidden');
        }

        /* 4. NET EVENTS */
        net.on('status', ({ online }) => {
            netBadge.innerHTML = online ? `🟢 В СЕТИ` : "🟡 СЕТЬ...";
            netBadge.className = online ? "p2p-badge p2p-badge-online" : "p2p-badge p2p-badge-waiting";
        });

        net.on('remote-stream', ({ peerId, stream }) => {
            let card = document.getElementById(`videoCard-${peerId}`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'p2p-video-card';
                card.id = `videoCard-${peerId}`;
                card.innerHTML = `
                    <video id="video-${peerId}" autoplay playsinline></video>
                    <div style="position: absolute; bottom: 10px; left: 10px; background: rgba(34, 47, 62, 0.85); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; border: 1.5px solid #fff; display: flex; align-items: center; gap: 6px; z-index: 10;">
                        <span id="tagMic-${peerId}">🎤</span><span>Участник</span>
                    </div>
                `;
                videoGrid.appendChild(card);
                AudioFX.playJoin();
            }
            document.getElementById(`video-${peerId}`).srcObject = stream;
        });

        net.on('peer-disconnected', ({ peerId }) => {
            const card = document.getElementById(`videoCard-${peerId}`);
            if (card) card.remove();
        });

        net.on('data', (data) => {
            if (data.type === 'CHAT_MSG') {
                AudioFX.playMsg();
                appendChatMessage(data.name, data.text, false);
            } else if (data.type === 'REACTION') {
                spawnFloatingReaction(data.emoji);
            } else if (data.type === 'MIC_STATUS') {
                const tagMic = document.getElementById(`tagMic-${data.peerId}`);
                if (tagMic) tagMic.textContent = data.isMicOn ? '🎤' : '🔇';
            }
        });

        /* 5. MEDIA CONTROLS */
        btnMicToggle.onclick = () => {
            if (!net.localStream) return;
            isMicOn = !isMicOn;
            net.localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
            btnMicToggle.style.background = isMicOn ? 'var(--p2p-surface-muted)' : 'var(--p2p-color-danger)';
            myTagMic.textContent = isMicOn ? '🎤' : '🔇';
            net.broadcast({ type: 'MIC_STATUS', peerId: net.peer.id, isMicOn });
        };

        btnCamToggle.onclick = () => {
            if (!net.localStream) return;
            isCamOn = !isCamOn;
            net.localStream.getVideoTracks().forEach(t => t.enabled = isCamOn);
            localVideo.style.display = isCamOn ? 'block' : 'none';
            myAvatar.style.display = isCamOn ? 'none' : 'block';
            btnCamToggle.style.background = isCamOn ? 'var(--p2p-surface-muted)' : 'var(--p2p-color-danger)';
        };

        btnScreenShare.onclick = async () => {
            if (!screenStream) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const track = screenStream.getVideoTracks()[0];
                    net.replaceTrack(track, 'video');
                    localVideo.srcObject = screenStream;
                    myVideoCard.classList.remove('mirrored');
                    btnScreenShare.classList.add('p2p-btn-warning');
                    track.onended = stopScreenShare;
                } catch (e) { }
            } else stopScreenShare();
        };

        function stopScreenShare() {
            if (!screenStream) return;
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
            const camTrack = net.localStream.getVideoTracks()[0];
            net.replaceTrack(camTrack, 'video');
            localVideo.srcObject = net.localStream;
            myVideoCard.classList.add('mirrored');
            btnScreenShare.classList.remove('p2p-btn-warning');
        }

        btnReactionToggle.onclick = () => reactionBar.classList.toggle('p2p-hidden');
        document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.onclick = () => {
                const emoji = btn.dataset.emoji;
                spawnFloatingReaction(emoji);
                net.broadcast({ type: 'REACTION', emoji });
                reactionBar.classList.add('p2p-hidden');
            };
        });

        function spawnFloatingReaction(emoji) {
            const el = document.createElement('div');
            el.className = 'p2p-float-item'; el.textContent = emoji;
            el.style.left = (Math.random() * 60 + 20) + '%';
            document.getElementById('reactionContainer').appendChild(el);
            setTimeout(() => el.remove(), 2200);
        }

        btnChatToggle.onclick = () => chatPanel.classList.toggle('p2p-hidden');
        document.getElementById('btnCloseChat').onclick = () => chatPanel.classList.add('p2p-hidden');

        document.getElementById('btnSendChat').onclick = sendChatMessage;
        inputChatMessage.onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        function sendChatMessage() {
            const text = inputChatMessage.value.trim();
            if (!text) return;
            appendChatMessage("Вы", text, true);
            net.broadcast({ type: 'CHAT_MSG', name: myName, text });
            inputChatMessage.value = '';
        }

        function appendChatMessage(sender, text, isMe) {
            const el = document.createElement('div');
            el.style.background = isMe ? '#e8f0fe' : 'var(--p2p-surface-muted)';
            el.style.border = '2px solid var(--p2p-border)';
            el.style.borderRadius = '12px';
            el.style.padding = '6px 10px';
            el.style.fontSize = '12px';
            el.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
            el.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('btnInviteInfo').onclick = () => {
            document.getElementById('modalRoomCode').textContent = net.roomId;
            const qrEl = document.getElementById('modalQrCode'); qrEl.innerHTML = "";
            new QRCode(qrEl, { text: net.getShareUrl(), width: 140, height: 140, colorDark: "#222f3e", colorLight: "#ffffff" });
            document.getElementById('inviteModal').classList.remove('p2p-hidden');
        };
        document.getElementById('btnCloseInviteModal').onclick = () => document.getElementById('inviteModal').classList.add('p2p-hidden');
        document.getElementById('btnCopyInviteLink').onclick = () => {
            navigator.clipboard.writeText(net.getShareUrl()).then(() => showToast("Ссылка скопирована!"));
        };

        document.getElementById('btnLeaveCall').onclick = () => location.reload();

        window.addEventListener('load', () => {
            initPreview();
            if (window.location.hash.length > 1) {
                inputRoomCode.value = P2PNet.cleanCode(window.location.hash.substring(1));
            }
        });
    </script>
</body>

</html>
