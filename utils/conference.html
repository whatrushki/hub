<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DROPCONF // P2P Видеоконференции</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../libs/css/p2p-ui.css">
    <link rel="stylesheet" href="../libs/css/theme-cartoon.css" id="themeStylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../libs/code/p2p-net.js"></script>

    <style>
        html,
        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .conf-app {
            width: 100%;
            height: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            box-sizing: border-box;
        }

        /* Область видео и чата */
        .conf-main-area {
            flex: 1;
            display: flex;
            gap: 6px;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        /* Сетка видеопотоков */
        .conf-grid {
            flex: 1;
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            grid-auto-rows: minmax(180px, 1fr);
            overflow-y: auto;
            align-content: start;
            padding: 2px;
            transition: all 0.2s ease;
        }

        /* Режим Spotlight (один поток во весь экран, остальные снизу полоской) */
        .conf-grid.has-spotlight {
            display: flex;
            flex-direction: column;
        }

        .conf-grid.has-spotlight .video-tile.spotlight {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-height: 80vh;
        }

        .conf-grid.has-spotlight .video-tile:not(.spotlight) {
            height: 110px;
            width: 180px;
            flex-shrink: 0;
        }

        .conf-grid-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
        }

        /* Карточка видеопотока */
        .video-tile {
            background: #1e272e;
            border: var(--p2p-border-width) solid var(--p2p-border);
            border-radius: var(--p2p-radius-md);
            overflow: hidden;
            position: relative;
            box-shadow: var(--p2p-shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16/9;
            min-height: 140px;
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-tile.mirrored video {
            transform: scaleX(-1);
        }

        .video-tile.screen-tile {
            border-color: var(--p2p-color-info);
        }

        .video-tile.screen-tile video {
            transform: none !important;
            object-fit: contain;
        }

        /* Плашка имени и оверлей кнопок на карточке */
        .tile-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            z-index: 10;
        }

        .tile-top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            pointer-events: auto;
            opacity: 0.85;
            transition: opacity 0.15s;
        }

        .tile-top-actions:hover {
            opacity: 1;
        }

        .tile-action-btn {
            background: rgba(34, 47, 62, 0.85);
            color: #fff;
            border: 1.5px solid #fff;
            border-radius: 8px;
            width: 30px;
            height: 30px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .tile-tag {
            align-self: flex-start;
            background: rgba(34, 47, 62, 0.88);
            color: #fff;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
        }

        .tile-avatar {
            position: absolute;
            font-size: 54px;
            z-index: 2;
        }

        /* Нижняя панель управления */
        .conf-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 10px;
            background: var(--p2p-surface);
            border: var(--p2p-border-width) solid var(--p2p-border);
            border-radius: var(--p2p-radius-lg);
            box-shadow: var(--p2p-shadow-sm);
        }

        .ctrl-btn {
            width: 44px;
            height: 44px;
            font-size: 18px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ctrl-btn.off {
            background: var(--p2p-color-danger) !important;
            color: #fff !important;
        }

        .ctrl-btn.active-screen {
            background: var(--p2p-color-info) !important;
            color: #fff !important;
            box-shadow: 0 0 10px var(--p2p-color-info);
        }

        /* Выезжающая шторка чата */
        .chat-drawer {
            width: 320px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 40;
            padding: 0;
        }

        @media (max-width: 768px) {
            .chat-drawer {
                position: absolute;
                inset: 0;
                width: 100%;
                background: var(--p2p-surface);
            }
        }
    </style>
</head>

<body>
    <div class="p2p-toast" id="toast">Уведомление</div>

    <div class="conf-app" id="reactionContainer">
        <!-- Шапка -->
        <header class="p2p-header" style="padding: 6px 12px;">
            <div class="p2p-logo" style="font-size: 16px;">🎥 DROPCONF</div>
            <div class="p2p-header-actions">
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnLogToggle" title="Логи">📜</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnSoundToggle" title="Звук UI">🔊</button>
                <div class="p2p-badge p2p-badge-waiting" id="netBadge">🟡 СЕТЬ...</div>
            </div>
        </header>

        <!-- 1. ЭКРАН ЛОББИ -->
        <div class="p2p-card" id="lobbyScreen"
            style="flex: 1; display: flex; flex-direction: column; justify-content: center; overflow-y: auto;">
            <div class="p2p-grid-2col" style="align-items: center; max-width: 750px; margin: 0 auto; width: 100%;">
                <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
                    <div class="video-tile mirrored" style="width: 100%; max-width: 320px; aspect-ratio: 4/3;">
                        <video id="previewVideo" autoplay playsinline muted></video>
                        <div id="previewAvatar" class="tile-avatar" style="display: none;">😎</div>
                    </div>
                    <div style="display: flex; gap: 8px; width: 100%; max-width: 320px;">
                        <button class="p2p-btn p2p-btn-warning" id="btnTogglePreviewMic" style="padding: 8px;">🎤
                            Микрофон</button>
                        <button class="p2p-btn p2p-btn-warning" id="btnTogglePreviewCam" style="padding: 8px;">📷
                            Камера</button>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; justify-content: center; width: 100%;">
                    <div>
                        <div
                            style="font-size: 12px; font-weight: 700; color: var(--p2p-text-muted); margin-bottom: 2px;">
                            ТВОЁ ИМЯ:</div>
                        <input type="text" class="p2p-input" id="inputUserName" placeholder="Введите имя..."
                            maxlength="15">
                    </div>
                    <div class="p2p-divider"></div>
                    <button class="p2p-btn p2p-btn-success" id="btnCreateRoom">🚀 Создать комнату</button>
                    <div style="text-align: center; font-weight: 800; font-size: 11px; color: var(--p2p-text-muted);">
                        ИЛИ ВОЙТИ ПО КОДУ</div>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" class="p2p-input p2p-input-code" id="inputRoomCode" placeholder="КОД"
                            maxlength="5">
                        <button class="p2p-btn p2p-btn-info" id="btnJoinRoom"
                            style="width: auto; padding: 0 16px;">Войти</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. ЭКРАН ЗВОНКА -->
        <div id="conferenceScreen" class="p2p-hidden"
            style="flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; min-height: 0;">
            <div class="conf-main-area">
                <!-- Сетка стримов (Камеры и Экраны) -->
                <div class="conf-grid" id="videoGrid">
                    <!-- Локальная камера -->
                    <div class="video-tile mirrored" id="localCamTile">
                        <video id="localVideo" autoplay playsinline muted></video>
                        <div id="myAvatar" class="tile-avatar" style="display: none;">😎</div>
                        <div class="tile-overlay">
                            <div class="tile-top-actions">
                                <button class="tile-action-btn btn-spotlight" title="Закрепить поток"
                                    onclick="toggleSpotlight('localCamTile')">📌</button>
                                <button class="tile-action-btn btn-fullscreen" title="На весь экран"
                                    onclick="toggleNativeFullscreen('localCamTile')">⛶</button>
                            </div>
                            <div class="tile-tag">
                                <span id="myTagMic">🎤</span>
                                <span id="myTagName">Вы</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Панель чата -->
                <div class="p2p-card chat-drawer p2p-hidden" id="chatPanel">
                    <div
                        style="padding: 8px 12px; background: var(--p2p-surface-muted); font-weight: 800; font-size: 12px; border-bottom: 2px solid var(--p2p-border); display: flex; justify-content: space-between;">
                        <span>💬 ЧАТ ЗВОНКА</span>
                        <span style="cursor: pointer;" id="btnCloseChat">✖</span>
                    </div>
                    <div id="chatMessages"
                        style="flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
                    </div>
                    <div style="padding: 6px; border-top: 2px solid var(--p2p-border); display: flex; gap: 4px;">
                        <input type="text" id="inputChatMessage" class="p2p-input"
                            style="padding: 6px 8px; font-size: 12px;" placeholder="Сообщение...">
                        <button class="p2p-btn p2p-btn-success p2p-btn-icon" id="btnSendChat">➤</button>
                    </div>
                </div>
            </div>

            <!-- Реакции -->
            <div class="p2p-card p2p-hidden" id="reactionBar"
                style="position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); padding: 6px 10px; display: flex; gap: 6px; z-index: 100;">
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="👍">👍</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="❤️">❤️</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="😂">😂</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="🔥">🔥</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="🎉">🎉</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon reaction-btn" data-emoji="👏">👏</button>
            </div>

            <!-- Панель управления -->
            <div class="conf-controls-bar">
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnMicToggle" title="Микрофон">🎤</button>
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnCamToggle" title="Камера">📷</button>
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnScreenShare"
                    title="Поделиться экраном">🖥️</button>
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnReactionToggle" title="Реакции">🎉</button>
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnChatToggle" title="Чат">💬</button>
                <button class="p2p-btn p2p-btn-neutral ctrl-btn" id="btnInviteInfo" title="Пригласить">🔗</button>
                <button class="p2p-btn p2p-btn-danger" id="btnLeaveCall"
                    style="width: auto; padding: 0 14px; height: 44px;">🔴 Выйти</button>
            </div>
        </div>

        <!-- Модалка инвайта -->
        <div class="p2p-modal-backdrop p2p-hidden" id="inviteModal">
            <div class="p2p-modal" style="max-width: 320px;">
                <div style="font-size: 16px; font-weight: 900; color: var(--p2p-color-primary);">КОД КОМНАТЫ</div>
                <div style="font-size: 24px; font-weight: 900; letter-spacing: 2px; color: var(--p2p-color-info); margin: 4px 0;"
                    id="modalRoomCode">...</div>
                <div id="modalQrCode" style="display: flex; justify-content: center; margin: 6px 0;"></div>
                <button class="p2p-btn p2p-btn-warning" id="btnCopyInviteLink" style="margin-bottom: 6px;">📋
                    Скопировать ссылку</button>
                <button class="p2p-btn p2p-btn-info" id="btnCloseInviteModal">Закрыть</button>
            </div>
        </div>

        <!-- Лог консоль -->
        <div class="p2p-card p2p-hidden" id="logConsole"
            style="position: absolute; bottom: 65px; left: 10px; right: 10px; background: #222f3e; color: #1dd1a1; font-family: monospace; font-size: 10px; max-height: 100px; overflow-y: auto; z-index: 200;">
            LOG: Инициализация...
        </div>
    </div>

    <script>
        /* 1. AUDIO FEEDBACK */
        const AudioFX = {
            ctx: null, muted: false,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playPop() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playJoin() {
                if (this.muted || !this.ctx) return;
                [440, 554.37, 659.25].forEach((f, i) => setTimeout(() => {
                    if (this.muted || !this.ctx) return;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.2);
                }, i * 70));
            }
        };
        window.addEventListener('click', () => AudioFX.init(), { once: true });

        const logConsole = document.getElementById('logConsole');
        document.getElementById('btnLogToggle').onclick = () => logConsole.classList.toggle('p2p-hidden');
        function sysLog(text) {
            console.log(text);
            const time = new Date().toTimeString().split(' ')[0];
            logConsole.innerHTML = `[${time}] ${text}<br>` + logConsole.innerHTML;
        }

        /* 2. STATE & NET */
        const net = new P2PNet({ appPrefix: 'dropconf', mode: 'mesh', debug: true });

        let myName = "Участник";
        let isCamOn = true;
        let isMicOn = true;
        let isScreenSharing = false;
        let screenStream = null;
        let activeSpotlightId = null;

        const toast = document.getElementById('toast');
        const netBadge = document.getElementById('netBadge');
        const lobbyScreen = document.getElementById('lobbyScreen');
        const conferenceScreen = document.getElementById('conferenceScreen');
        const previewVideo = document.getElementById('previewVideo');
        const previewAvatar = document.getElementById('previewAvatar');
        const inputUserName = document.getElementById('inputUserName');
        const inputRoomCode = document.getElementById('inputRoomCode');
        const localVideo = document.getElementById('localVideo');
        const myAvatar = document.getElementById('myAvatar');
        const myTagName = document.getElementById('myTagName');
        const myTagMic = document.getElementById('myTagMic');
        const videoGrid = document.getElementById('videoGrid');

        const btnMicToggle = document.getElementById('btnMicToggle');
        const btnCamToggle = document.getElementById('btnCamToggle');
        const btnScreenShare = document.getElementById('btnScreenShare');
        const btnReactionToggle = document.getElementById('btnReactionToggle');
        const reactionBar = document.getElementById('reactionBar');
        const btnChatToggle = document.getElementById('btnChatToggle');
        const chatPanel = document.getElementById('chatPanel');
        const chatMessages = document.getElementById('chatMessages');
        const inputChatMessage = document.getElementById('inputChatMessage');

        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }

        /* 3. ИНИЦИАЛИЗАЦИЯ МЕДИА */
        async function initPreview() {
            try {
                const stream = await net.startMedia({ video: { width: 1280, height: 720 }, audio: true });
                previewVideo.srcObject = stream;
                localVideo.srcObject = stream;
            } catch (e) {
                sysLog("Камера/микрофон не получены: " + e.message);
                isCamOn = false;
                isMicOn = false;
                previewAvatar.style.display = 'block';
                myAvatar.style.display = 'block';
                btnCamToggle.classList.add('off');
                btnMicToggle.classList.add('off');
            }
        }

        /* 4. УПРАВЛЕНИЕ ЖЕЛЕЗОМ (ПОЛНОЕ ВЫКЛЮЧЕНИЕ / ВКЛЮЧЕНИЕ ТРЕКОВ) */
        async function toggleCamera() {
            if (isCamOn) {
                // Полностью глушим железо (светодиод камеры гаснет)
                if (net.localStream) {
                    net.localStream.getVideoTracks().forEach(t => {
                        t.stop();
                        net.localStream.removeTrack(t);
                    });
                }
                isCamOn = false;
                localVideo.srcObject = null;
                previewVideo.srcObject = null;
                myAvatar.style.display = 'block';
                previewAvatar.style.display = 'block';
                btnCamToggle.classList.add('off');
                btnCamToggle.innerHTML = '🚫 📷';
                net.broadcast({ type: 'CAM_STATUS', isCamOn: false });
                sysLog("Камера выключена (железо освобождено)");
            } else {
                // Заново запрашиваем видеопоток у операционной системы
                try {
                    const freshStream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                    const newVideoTrack = freshStream.getVideoTracks()[0];

                    if (!net.localStream) {
                        net.localStream = freshStream;
                    } else {
                        net.localStream.addTrack(newVideoTrack);
                    }

                    localVideo.srcObject = net.localStream;
                    previewVideo.srcObject = net.localStream;
                    localVideo.play().catch(() => { });
                    previewVideo.play().catch(() => { });

                    myAvatar.style.display = 'none';
                    previewAvatar.style.display = 'none';
                    isCamOn = true;
                    btnCamToggle.classList.remove('off');
                    btnCamToggle.innerHTML = '📷';

                    // Подменяем трек во всех активных звонках
                    net.replaceTrack(newVideoTrack, 'video');
                    net.broadcast({ type: 'CAM_STATUS', isCamOn: true });
                    sysLog("Камера включена заново");
                } catch (err) {
                    showToast("Не удалось включить камеру: " + err.message);
                }
            }
        }

        async function toggleMicrophone() {
            if (isMicOn) {
                // Полностью глушим микрофон
                if (net.localStream) {
                    net.localStream.getAudioTracks().forEach(t => {
                        t.stop();
                        net.localStream.removeTrack(t);
                    });
                }
                isMicOn = false;
                myTagMic.textContent = '🔇';
                btnMicToggle.classList.add('off');
                btnMicToggle.innerHTML = '🚫 🎤';
                document.getElementById('btnTogglePreviewMic').textContent = '🔇 Выкл';
                net.broadcast({ type: 'MIC_STATUS', isMicOn: false });
                sysLog("Микрофон выключен (железо освобождено)");
            } else {
                // Заново запрашиваем аудиопоток
                try {
                    const freshStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                    const newAudioTrack = freshStream.getAudioTracks()[0];

                    if (!net.localStream) {
                        net.localStream = freshStream;
                    } else {
                        net.localStream.addTrack(newAudioTrack);
                    }

                    isMicOn = true;
                    myTagMic.textContent = '🎤';
                    btnMicToggle.classList.remove('off');
                    btnMicToggle.innerHTML = '🎤';
                    document.getElementById('btnTogglePreviewMic').textContent = '🎤 Микрофон';

                    // Подменяем аудиотрек в звонках
                    net.replaceTrack(newAudioTrack, 'audio');
                    net.broadcast({ type: 'MIC_STATUS', isMicOn: true });
                    sysLog("Микрофон включен заново");
                } catch (err) {
                    showToast("Не удалось включить микрофон: " + err.message);
                }
            }
        }

        btnCamToggle.onclick = toggleCamera;
        btnMicToggle.onclick = toggleMicrophone;
        document.getElementById('btnTogglePreviewCam').onclick = toggleCamera;
        document.getElementById('btnTogglePreviewMic').onclick = toggleMicrophone;

        /* 5. НЕЗАВИСИМАЯ ДЕМОНСТРАЦИЯ ЭКРАНА СО ЗВУКОМ */
        async function toggleScreenShare() {
            if (isScreenSharing) {
                stopScreenShare();
            } else {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    return showToast("Экран не поддерживается на данном устройстве");
                }

                try {
                    // Запрашиваем экран и звук вкладки/системы
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: "always" },
                        audio: true
                    });

                    isScreenSharing = true;
                    btnScreenShare.classList.add('active-screen');
                    btnScreenShare.innerHTML = '🛑 Экран';

                    // 1. Создаем отдельную плитку для своего экрана
                    addOrUpdateScreenTile('local-screen', screenStream, `${myName} (Экран)`, true);

                    // 2. Рассылаем экран как отдельный медиапоток всем участникам
                    net.startScreenShare(screenStream, myName);

                    // Обработка кнопки "Остановить показ" в браузере
                    screenStream.getVideoTracks()[0].onended = () => {
                        stopScreenShare();
                    };
                    sysLog("Экран и аудио транслируются отдельным потоком");
                } catch (err) {
                    if (err.name !== 'NotAllowedError') {
                        showToast("Ошибка экрана: " + err.message);
                    }
                }
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            isScreenSharing = false;
            btnScreenShare.classList.remove('active-screen');
            btnScreenShare.innerHTML = '🖥️';

            // Удаляем свою плитку экрана
            removeTile('tile-local-screen');
            net.stopScreenShare();
            sysLog("Демонстрация экрана остановлена");
        }

        btnScreenShare.onclick = toggleScreenShare;

        /* 6. УПРАВЛЕНИЕ КАРТОЧКАМИ В СЕТКЕ (ПОЛНОЭКРАННЫЙ РЕЖИМ И SPOTLIGHT) */
        function addOrUpdateCamTile(peerId, stream, participantName) {
            const tileId = `tile-cam-${peerId}`;
            let tile = document.getElementById(tileId);

            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'video-tile mirrored';
                tile.id = tileId;
                tile.innerHTML = `
                    <video id="video-cam-${peerId}" autoplay playsinline style="width:100%; height:100%;"></video>
                    <div id="avatar-cam-${peerId}" class="tile-avatar" style="display:none;">😎</div>
                    <div class="tile-overlay">
                        <div class="tile-top-actions">
                            <button class="tile-action-btn" title="Закрепить" onclick="toggleSpotlight('${tileId}')">📌</button>
                            <button class="tile-action-btn" title="Во весь экран" onclick="toggleNativeFullscreen('${tileId}')">⛶</button>
                        </div>
                        <div class="tile-tag">
                            <span id="mic-cam-${peerId}">🎤</span>
                            <span>${participantName || 'Участник'}</span>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(tile);
                AudioFX.playJoin();
            }

            const videoEl = document.getElementById(`video-cam-${peerId}`);
            if (videoEl && stream) {
                videoEl.srcObject = stream;
                videoEl.play().catch(e => sysLog("Autoplay cam: " + e));
            }
        }

        function addOrUpdateScreenTile(peerId, stream, titleName, isLocal = false) {
            const tileId = `tile-screen-${peerId}`;
            let tile = document.getElementById(tileId);

            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'video-tile screen-tile';
                tile.id = tileId;
                tile.innerHTML = `
                    <video id="video-screen-${peerId}" autoplay playsinline ${isLocal ? 'muted' : ''} style="width:100%; height:100%;"></video>
                    <div class="tile-overlay">
                        <div class="tile-top-actions">
                            <button class="tile-action-btn" title="Закрепить" onclick="toggleSpotlight('${tileId}')">📌</button>
                            <button class="tile-action-btn" title="Во весь экран" onclick="toggleNativeFullscreen('${tileId}')">⛶</button>
                        </div>
                        <div class="tile-tag" style="background: rgba(9, 132, 227, 0.9);">
                            <span>🖥️</span>
                            <span>${titleName || 'Демонстрация экрана'}</span>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(tile);
                AudioFX.playJoin();
            }

            const videoEl = document.getElementById(`video-screen-${peerId}`);
            if (videoEl && stream) {
                videoEl.srcObject = stream;
                videoEl.play().catch(e => sysLog("Autoplay screen: " + e));
            }
        }

        function removeTile(tileId) {
            const tile = document.getElementById(tileId);
            if (tile) {
                if (activeSpotlightId === tileId) {
                    toggleSpotlight(tileId);
                }
                tile.remove();
            }
        }

        // Spotlight (закрепление видео в центре интерфейса)
        window.toggleSpotlight = function (tileId) {
            const tile = document.getElementById(tileId);
            if (!tile) return;

            if (activeSpotlightId === tileId) {
                tile.classList.remove('spotlight');
                videoGrid.classList.remove('has-spotlight');
                activeSpotlightId = null;
            } else {
                if (activeSpotlightId) {
                    const prev = document.getElementById(activeSpotlightId);
                    if (prev) prev.classList.remove('spotlight');
                }
                tile.classList.add('spotlight');
                videoGrid.classList.add('has-spotlight');
                activeSpotlightId = tileId;
            }
        };

        // Fullscreen API (на весь дисплей устройства)
        window.toggleNativeFullscreen = function (tileId) {
            const tile = document.getElementById(tileId);
            if (!tile) return;

            if (!document.fullscreenElement) {
                if (tile.requestFullscreen) tile.requestFullscreen();
                else if (tile.webkitRequestFullscreen) tile.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        /* 7. ВХОД И СОЗДАНИЕ КОМНАТЫ */
        document.getElementById('btnCreateRoom').onclick = async () => {
            AudioFX.playPop();
            prepareJoin();
            try {
                const code = await net.createRoom();
                netBadge.innerHTML = `🟢 ${code}`;
                netBadge.className = "p2p-badge p2p-badge-online";
                showToast("Комната создана!");
            } catch (err) {
                alert("Ошибка: " + err.message);
            }
        };

        document.getElementById('btnJoinRoom').onclick = () => {
            AudioFX.playPop();
            const code = inputRoomCode.value.trim();
            if (code.length < 3) return showToast("Введите код!");
            prepareJoin();
            net.joinRoom(code, { name: myName }).catch(err => {
                alert("Не удалось войти в конференцию");
                location.reload();
            });
        };

        function prepareJoin() {
            myName = inputUserName.value.trim() || ("Кот-" + Math.floor(Math.random() * 900 + 100));
            myTagName.textContent = myName + " (Вы)";
            lobbyScreen.classList.add('p2p-hidden');
            conferenceScreen.classList.remove('p2p-hidden');
        }

        /* 8. P2P СОБЫТИЯ */
        net.on('status', ({ online }) => {
            netBadge.innerHTML = online ? (net.roomId ? `🟢 ${net.roomId}` : `🟢 ОНЛАЙН`) : "🟡 СЕТЬ...";
            netBadge.className = online ? "p2p-badge p2p-badge-online" : "p2p-badge p2p-badge-waiting";
        });

        net.on('remote-stream', ({ peerId, stream, metadata }) => {
            if (metadata?.type === 'screen') {
                addOrUpdateScreenTile(peerId, stream, `${metadata.name || 'Участник'} (Экран)`);
            } else {
                addOrUpdateCamTile(peerId, stream, metadata?.name);
            }
        });

        net.on('peer-disconnected', ({ peerId }) => {
            removeTile(`tile-cam-${peerId}`);
            removeTile(`tile-screen-${peerId}`);
        });

        net.on('data', (data, senderPeerId) => {
            if (data.type === 'CHAT_MSG') {
                AudioFX.playPop();
                appendChatMessage(data.name, data.text, false);
            } else if (data.type === 'REACTION') {
                spawnFloatingReaction(data.emoji);
            } else if (data.type === 'MIC_STATUS') {
                const micEl = document.getElementById(`mic-cam-${senderPeerId}`);
                if (micEl) micEl.textContent = data.isMicOn ? '🎤' : '🔇';
            } else if (data.type === 'CAM_STATUS') {
                const vid = document.getElementById(`video-cam-${senderPeerId}`);
                const avt = document.getElementById(`avatar-cam-${senderPeerId}`);
                if (vid && avt) {
                    vid.style.display = data.isCamOn ? 'block' : 'none';
                    avt.style.display = data.isCamOn ? 'none' : 'block';
                }
            } else if (data.type === 'SCREEN_STOPPED') {
                removeTile(`tile-screen-${senderPeerId}`);
            }
        });

        /* 9. РЕАКЦИИ И ЧАТ */
        btnReactionToggle.onclick = () => reactionBar.classList.toggle('p2p-hidden');
        document.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.onclick = () => {
                const emoji = btn.dataset.emoji;
                spawnFloatingReaction(emoji);
                net.broadcast({ type: 'REACTION', emoji });
                reactionBar.classList.add('p2p-hidden');
            };
        });

        function spawnFloatingReaction(emoji) {
            const el = document.createElement('div');
            el.className = 'p2p-float-item';
            el.textContent = emoji;
            el.style.left = (Math.random() * 60 + 20) + '%';
            document.getElementById('reactionContainer').appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        btnChatToggle.onclick = () => chatPanel.classList.toggle('p2p-hidden');
        document.getElementById('btnCloseChat').onclick = () => chatPanel.classList.add('p2p-hidden');

        document.getElementById('btnSendChat').onclick = sendChatMessage;
        inputChatMessage.onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        function sendChatMessage() {
            const text = inputChatMessage.value.trim();
            if (!text) return;
            appendChatMessage("Вы", text, true);
            net.broadcast({ type: 'CHAT_MSG', name: myName, text });
            inputChatMessage.value = '';
        }

        function appendChatMessage(sender, text, isMe) {
            const el = document.createElement('div');
            el.style.background = isMe ? 'var(--p2p-color-info)' : 'var(--p2p-surface-muted)';
            el.style.color = isMe ? '#fff' : 'var(--p2p-text)';
            el.style.border = '2px solid var(--p2p-border)';
            el.style.borderRadius = '8px';
            el.style.padding = '4px 8px';
            el.style.fontSize = '11px';
            el.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
            el.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatMessages.appendChild(el);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('btnInviteInfo').onclick = () => {
            document.getElementById('modalRoomCode').textContent = net.roomId;
            const qrEl = document.getElementById('modalQrCode'); qrEl.innerHTML = "";
            new QRCode(qrEl, { text: net.getShareUrl(), width: 140, height: 140, colorDark: "#222f3e", colorLight: "#ffffff" });
            document.getElementById('inviteModal').classList.remove('p2p-hidden');
        };
        document.getElementById('btnCloseInviteModal').onclick = () => document.getElementById('inviteModal').classList.add('p2p-hidden');
        document.getElementById('btnCopyInviteLink').onclick = () => {
            navigator.clipboard.writeText(net.getShareUrl()).then(() => showToast("Ссылка скопирована!"));
        };

        document.getElementById('btnLeaveCall').onclick = () => location.reload();

        window.addEventListener('load', () => {
            initPreview();
            if (window.location.hash.length > 1) {
                inputRoomCode.value = P2PNet.cleanCode(window.location.hash.substring(1));
            }
        });
    </script>
</body>

</html>
