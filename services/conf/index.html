<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WHAT CONF</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../../libs/code/p2p-net.js"></script>
</head>

<body>
    <!-- УВЕДОМЛЕНИЯ / TOAST -->
    <div class="p2p-toast" id="toast">
        <span class="material-symbols-outlined" id="toastIcon">info</span>
        <span id="toastText">Уведомление</span>
    </div>

    <div class="conf-app" id="appRoot">
        <!-- ХЕДЕР -->
        <header class="studio-header">
            <div class="studio-logo-area">
                <span class="gemini-sparkle">✦</span>
                <div class="studio-title">WHAT CONF</div>
            </div>

            <div class="header-actions">
                <div class="studio-badge" id="netBadge">
                    <span class="status-dot"></span>
                    <span id="netBadgeText">STANDBY</span>
                </div>
                <button class="studio-btn-compact" id="btnOpenLogs" title="Системный аудит">
                    <span class="material-symbols-outlined" style="color: var(--google-yellow);">terminal</span>
                    <span class="hide-mobile">Audit</span>
                </button>
                <button class="studio-btn-compact" id="btnSettingsOpen" title="Настройки">
                    <span class="material-symbols-outlined">settings</span>
                </button>
            </div>
        </header>

        <!-- ЛОББИ -->
        <div class="lobby-container" id="lobbyScreen">
            <div class="lobby-card">
                <div class="lobby-preview-pane">
                    <div class="video-tile mirrored" id="previewTile">
                        <video id="previewVideo" autoplay playsinline muted></video>
                        <div id="previewAvatar" class="tile-avatar" style="display: none;">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                    </div>
                    <div class="preview-controls">
                        <button class="studio-btn-secondary" id="btnTogglePreviewMic">
                            <span class="material-symbols-outlined">mic</span> <span class="hide-mobile">Mic</span>
                        </button>
                        <button class="studio-btn-secondary" id="btnTogglePreviewCam">
                            <span class="material-symbols-outlined">videocam</span> <span class="hide-mobile">Cam</span>
                        </button>
                        <button class="studio-btn-secondary" id="btnFlipCamPreview" title="Сменить камеру">
                            <span class="material-symbols-outlined">flip_camera_ios</span>
                        </button>
                    </div>
                </div>

                <div class="lobby-settings-pane">
                    <div class="input-group">
                        <label class="studio-label">NAME / CALLSIGN</label>
                        <input type="text" class="studio-input" id="inputUserName" placeholder="Ваше имя..."
                            maxlength="18">
                    </div>

                    <button class="studio-btn-primary" id="btnCreateRoom">
                        <span class="material-symbols-outlined">video_call</span> Создать встречу
                    </button>

                    <div class="divider-text">
                        <span>ИЛИ ВХОД ПО КОДУ</span>
                    </div>

                    <div class="join-row">
                        <input type="text" class="studio-input input-room-code" id="inputRoomCode" placeholder="КОД"
                            maxlength="6">
                        <button class="studio-btn-secondary" id="btnJoinRoom">Войти</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- КОНФЕРЕНЦИЯ -->
        <div id="conferenceScreen" class="conference-container p2p-hidden">
            <!-- ОСНОВНАЯ ЗОНА (ВИДЕО СЕТКА + ЧАТ) -->
            <div class="conf-main-area" id="confMainArea">
                <div class="conf-video-container" id="videoWrapper">
                    <div class="conf-grid count-1" id="videoGrid">
                        <!-- Локальная камера -->
                        <div class="video-tile mirrored" id="tile-cam-local" data-peer="local">
                            <video id="localVideo" autoplay playsinline muted></video>
                            <div id="myAvatar" class="tile-avatar" style="display: none;">
                                <span class="material-symbols-outlined">person</span>
                            </div>

                            <!-- Плавающий бар управления карточкой -->
                            <div class="tile-hover-controls">
                                <button class="tile-ctrl-btn" title="Закрепить"
                                    onclick="togglePinTile('tile-cam-local')">
                                    <span class="material-symbols-outlined">keep</span>
                                </button>
                                <button class="tile-ctrl-btn" title="На весь экран"
                                    onclick="toggleNativeFullscreen('tile-cam-local')">
                                    <span class="material-symbols-outlined">fullscreen</span>
                                </button>
                            </div>

                            <div class="tile-overlay">
                                <div class="tile-top-actions">
                                    <div class="hand-badge p2p-hidden" id="myHandBadge">✋ Рука</div>
                                </div>
                                <div class="tile-tag">
                                    <span id="myTagMic" class="material-symbols-outlined mic-icon">mic</span>
                                    <span id="myTagName">Вы</span>
                                    <span id="myHostCrown" class="material-symbols-outlined host-crown p2p-hidden"
                                        title="Организатор встречи">crown</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Всплывающие уведомления чата поверх видео -->
                    <div class="chat-toast-container" id="chatToastContainer"></div>
                </div>

                <!-- БОКОВОЙ ЧАТ -->
                <aside class="chat-drawer p2p-hidden" id="chatPanel">
                    <div class="chat-header">
                        <div class="chat-header-title">
                            <span class="material-symbols-outlined">chat</span>
                            <span>Сообщения встречи</span>
                        </div>
                        <button class="tile-action-btn" id="btnCloseChat" title="Закрыть чат">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-box">
                        <input type="text" id="inputChatMessage" class="studio-input"
                            placeholder="Отправить сообщение...">
                        <button class="studio-btn-primary send-btn" id="btnSendChat" title="Отправить">
                            <span class="material-symbols-outlined">send</span>
                        </button>
                    </div>
                </aside>
            </div>

            <!-- ПАНЕЛЬ ЭМОДЗИ -->
            <div class="reactions-popover p2p-hidden" id="reactionBar">
                <button class="reaction-item-btn" data-emoji="👍">👍</button>
                <button class="reaction-item-btn" data-emoji="❤️">❤️</button>
                <button class="reaction-item-btn" data-emoji="😂">😂</button>
                <button class="reaction-item-btn" data-emoji="🔥">🔥</button>
                <button class="reaction-item-btn" data-emoji="🎉">🎉</button>
                <button class="reaction-item-btn" data-emoji="👏">👏</button>
                <button class="reaction-item-btn" data-emoji="😮">😮</button>
                <button class="reaction-item-btn" data-emoji="🤔">🤔</button>
                <button class="reaction-item-close" id="btnCloseReactions" title="Закрыть">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- НИЖНЯЯ ПАНЕЛЬ GOOGLE MEET -->
            <footer class="meet-bottom-bar">
                <div class="meet-bar-left hide-mobile">
                    <div class="meet-time-pill" id="meetLiveTime">12:00</div>
                    <div class="meet-room-pill" id="meetRoomCodePill" title="Копировать код">
                        <span id="meetRoomCodeText">ROOM</span>
                        <span class="material-symbols-outlined" style="font-size: 14px;">content_copy</span>
                    </div>
                </div>

                <div class="meet-bar-center">
                    <button class="meet-btn" id="btnMicToggle" title="Микрофон [M]">
                        <span class="material-symbols-outlined">mic</span>
                    </button>
                    <button class="meet-btn" id="btnCamToggle" title="Камера [V]">
                        <span class="material-symbols-outlined">videocam</span>
                    </button>
                    <button class="meet-btn" id="btnFlipCam" title="Сменить камеру">
                        <span class="material-symbols-outlined">flip_camera_ios</span>
                    </button>
                    <button class="meet-btn" id="btnScreenShare" title="Поделиться экраном [S]">
                        <span class="material-symbols-outlined">present_to_all</span>
                    </button>
                    <button class="meet-btn" id="btnHandRaise" title="Поднять руку [H]">
                        <span class="material-symbols-outlined">back_hand</span>
                    </button>
                    <button class="meet-btn" id="btnReactionToggle" title="Реакции">
                        <span class="material-symbols-outlined">add_reaction</span>
                    </button>
                    <button class="meet-btn meet-btn-danger" id="btnLeaveCall" title="Покинуть звонок">
                        <span class="material-symbols-outlined">call_end</span>
                    </button>
                </div>

                <div class="meet-bar-right">
                    <button class="meet-btn" id="btnInviteInfo" title="Информация о встрече">
                        <span class="material-symbols-outlined">info</span>
                    </button>
                    <button class="meet-btn" id="btnChatToggle" title="Чат [C]">
                        <span class="material-symbols-outlined">chat</span>
                        <span class="chat-unread-dot p2p-hidden" id="chatUnreadDot"></span>
                    </button>
                </div>
            </footer>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
        <div class="p2p-modal-backdrop p2p-hidden" id="settingsModal">
            <div class="studio-modal modal-settings">
                <div class="modal-header">
                    <div class="modal-title">
                        <span class="material-symbols-outlined">settings</span> Настройки
                    </div>
                    <button class="tile-action-btn" id="btnCloseSettings"><span
                            class="material-symbols-outlined">close</span></button>
                </div>

                <div class="settings-tabs-scroll">
                    <div class="settings-tabs">
                        <button class="settings-tab-btn active" data-tab="tab-devices">Оборудование</button>
                        <button class="settings-tab-btn" data-tab="tab-ui">Интерфейс & Звук</button>
                        <button class="settings-tab-btn" data-tab="tab-admin">Администрирование</button>
                    </div>
                </div>

                <div class="settings-body">
                    <!-- ТАБ 1: ОБОРУДОВАНИЕ -->
                    <div class="tab-content active" id="tab-devices">
                        <div class="settings-form-group">
                            <label class="studio-label">Камера</label>
                            <select class="studio-select" id="selectVideoInput"></select>
                        </div>
                        <div class="settings-form-group">
                            <label class="studio-label">Микрофон</label>
                            <select class="studio-select" id="selectAudioInput"></select>
                        </div>
                        <div class="settings-form-group">
                            <label class="studio-label">Динамики</label>
                            <select class="studio-select" id="selectAudioOutput"></select>
                        </div>
                        <div class="settings-checkbox-group">
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkNoiseSuppression" checked>
                                <span>Шумоподавление и эхоподавление</span>
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkMirrorVideo" checked>
                                <span>Зеркалировать собственную камеру</span>
                            </label>
                        </div>
                    </div>

                    <!-- ТАБ 2: ИНТЕРФЕЙС И ЗВУКИ -->
                    <div class="tab-content" id="tab-ui">
                        <div class="settings-checkbox-group">
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkSoundFx" checked>
                                <span>Звуковые эффекты</span>
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkChatToasts" checked>
                                <span>Всплывающие сообщения поверх видео</span>
                            </label>
                        </div>
                        <div class="settings-form-group" style="margin-top: 10px;">
                            <label class="studio-label">Громкость звуков</label>
                            <input type="range" class="studio-range" id="rangeSoundVolume" min="0" max="1" step="0.05"
                                value="0.5">
                        </div>
                    </div>

                    <!-- ТАБ 3: АДМИНИСТРИРОВАНИЕ -->
                    <div class="tab-content" id="tab-admin">
                        <div class="admin-status-box" id="adminStatusBox">
                            <span class="material-symbols-outlined" id="adminStatusIcon">admin_panel_settings</span>
                            <span id="adminStatusText">Вы являетесь администратором комнаты</span>
                        </div>

                        <div class="settings-checkbox-group" id="adminControlsBlock">
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkLockRoom">
                                <span>Заблокировать комнату для новых участников</span>
                            </label>
                            <label class="checkbox-container">
                                <input type="checkbox" id="chkAllowScreenShare" checked>
                                <span>Разрешить участникам демонстрацию экрана</span>
                            </label>
                        </div>

                        <div class="admin-participants-area">
                            <div class="studio-label" style="margin-bottom: 6px;">Участники встречи</div>
                            <div class="participants-list" id="adminParticipantsList"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="studio-btn-primary" id="btnSaveSettings">Применить</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО АУДИТА СИСТЕМЫ -->
        <div class="p2p-modal-backdrop p2p-hidden" id="logModal">
            <div class="studio-modal modal-large">
                <div class="modal-header">
                    <div class="modal-title">
                        <span class="material-symbols-outlined" style="color: var(--google-yellow);">terminal</span>
                        <span class="hide-mobile">Системный аудит</span>
                    </div>
                    <div class="modal-header-actions">
                        <button class="studio-btn-secondary" id="btnCopyLogs" title="Копировать">
                            <span class="material-symbols-outlined">content_copy</span> <span
                                class="hide-mobile">Копировать</span>
                        </button>
                        <button class="studio-btn-secondary" id="btnClearLogs" title="Очистить">
                            <span class="material-symbols-outlined">delete</span> <span
                                class="hide-mobile">Очистить</span>
                        </button>
                        <button class="tile-action-btn" id="btnCloseLogs"><span
                                class="material-symbols-outlined">close</span></button>
                    </div>
                </div>
                <div class="log-terminal-window" id="logTerminal"></div>
            </div>
        </div>

        <!-- МОДАЛКА ПРИГЛАШЕНИЯ -->
        <div class="p2p-modal-backdrop p2p-hidden" id="inviteModal">
            <div class="studio-modal modal-invite">
                <div class="modal-header">
                    <div class="modal-title">Пригласить участников</div>
                    <button class="tile-action-btn" id="btnCloseInviteModal"><span
                            class="material-symbols-outlined">close</span></button>
                </div>
                <div class="invite-content">
                    <div class="studio-label">КОД ВСТРЕЧИ</div>
                    <div class="room-code-display" id="modalRoomCode">...</div>
                    <div id="modalQrCode" class="qr-container"></div>
                    <button class="studio-btn-primary" id="btnCopyInviteLink" style="width: 100%;">
                        <span class="material-symbols-outlined">link</span> Скопировать ссылку
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
