<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BATTLESHIP // Морской Бой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../libs/css/p2p-ui.css">
    <link rel="stylesheet" href="../libs/css/theme-cartoon.css" id="themeStylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="../libs/code/p2p-net.js"></script>
</head>

<body>
    <div class="p2p-toast" id="toast">Уведомление</div>

    <div class="p2p-app" id="appContainer">
        <header class="p2p-header">
            <div class="p2p-logo">⚓ BATTLESHIP</div>
            <div class="p2p-header-actions">
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnSoundToggle">🔊 Вкл</button>
                <div class="p2p-badge p2p-badge-online p2p-hidden" id="netStatus">🟢 ОНЛАЙН</div>
            </div>
        </header>

        <!-- SCREEN 1: Menu -->
        <div class="p2p-card" id="screenMenu"
            style="display: flex; flex-direction: column; gap: 10px; text-align: center;">
            <h1 style="font-size: 22px; line-height: 1.1;">МОРСКОЙ БОЙ</h1>
            <p style="font-size: 13px; color: var(--p2p-text-muted);">Классическая битва флотов 10×10</p>
            <button class="p2p-btn p2p-btn-success" id="btnPlayBot">🤖 Играть против Бота</button>
            <div class="p2p-divider">ИЛИ ДУЭЛЬ С ДРУГОМ</div>
            <button class="p2p-btn p2p-btn-warning" id="btnCreateRoom">👑 Создать комнату</button>
            <div style="display: flex; gap: 6px;">
                <input type="text" class="p2p-input p2p-input-code" id="inputRoomCode" placeholder="КОД" maxlength="5">
                <button class="p2p-btn p2p-btn-info" id="btnJoinRoom" style="width: 80px;">GO</button>
            </div>
        </div>

        <!-- SCREEN 2: Lobby -->
        <div class="p2p-card p2p-hidden" id="screenLobby"
            style="display: flex; flex-direction: column; gap: 10px; text-align: center;">
            <h2 style="font-size: 22px;">ЖДЕМ СОПЕРНИКА</h2>
            <p style="font-size: 13px; color: var(--p2p-text-muted);">Нажми на код, чтобы скопировать:</p>
            <div class="p2p-input p2p-input-code" id="displayRoomCode"
                style="font-size: 30px; background: #fff; cursor: pointer;">-----</div>
            <button class="p2p-btn p2p-btn-warning" id="btnCopyLink">📋 Скопировать ссылку</button>
            <button class="p2p-btn p2p-btn-danger" id="btnLeaveLobby">Отмена</button>
        </div>

        <!-- SCREEN 3: Placement Phase -->
        <div class="p2p-card p2p-hidden" id="screenPlacement" style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 18px;">РАССТАВЬ ФЛОТ</h2>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnRotate">🔄 ГОРИЗОНТ.</button>
            </div>
            <div id="placementCounter"
                style="display: flex; justify-content: space-around; background: var(--p2p-surface-muted); border: var(--p2p-border-width) solid var(--p2p-border); border-radius: var(--p2p-radius-sm); padding: 6px; font-size: 12px; font-weight: 700;">
            </div>
            <div class="p2p-grid-10x10" id="placementGrid"></div>
            <div style="display: flex; gap: 6px; margin-top: 4px;">
                <button class="p2p-btn p2p-btn-info" id="btnAutoPlace" style="font-size: 14px; padding: 8px;">🎲
                    Авто</button>
                <button class="p2p-btn p2p-btn-danger" id="btnClearPlacement" style="font-size: 14px; padding: 8px;">🗑️
                    Сброс</button>
            </div>
            <button class="p2p-btn p2p-btn-success" id="btnReadyToFight" disabled style="opacity: 0.5;">⚔️ В
                БОЙ!</button>
        </div>

        <!-- SCREEN 4: Battle Screen -->
        <div class="p2p-card p2p-hidden" id="screenBattle" style="padding: 10px;">
            <div
                style="display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px;">
                <button class="p2p-btn p2p-btn-danger p2p-btn-icon" id="btnSurrender">🚪 Меню</button>
                <div class="p2p-badge p2p-badge-waiting" id="turnBanner"
                    style="flex: 1; padding: 6px; font-size: 13px;">Твой выстрел!</div>
            </div>
            <div
                style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; margin-bottom: 4px; padding: 0 4px;">
                <span>Твой флот: <b id="myFleetAlive" style="color:var(--p2p-color-success)">10</b></span>
                <span>Флот врага: <b id="enemyFleetAlive" style="color:var(--p2p-color-primary)">10</b></span>
            </div>
            <div class="p2p-tabs">
                <button class="p2p-tab active" id="tabEnemy">🎯 РАДАР (АТАКА)</button>
                <button class="p2p-tab" id="tabMy">🛡️ МОЙ ФЛОТ</button>
            </div>
            <div class="p2p-grid-10x10" id="enemyRadarGrid"></div>
            <div class="p2p-grid-10x10 p2p-hidden" id="myFleetGrid"></div>

            <div
                style="display: flex; justify-content: space-between; background: var(--p2p-surface-muted); border: var(--p2p-border-width) solid var(--p2p-border); border-radius: var(--p2p-radius-sm); padding: 4px 6px; margin-top: 6px;">
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="🎯"
                    style="background:none; border:none; box-shadow:none;">🎯</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="💥"
                    style="background:none; border:none; box-shadow:none;">💥</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="🌊"
                    style="background:none; border:none; box-shadow:none;">🌊</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="💀"
                    style="background:none; border:none; box-shadow:none;">💀</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="🤡"
                    style="background:none; border:none; box-shadow:none;">🤡</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="🔥"
                    style="background:none; border:none; box-shadow:none;">🔥</button>
                <button class="p2p-btn p2p-btn-icon emoji-btn" data-emoji="🎉"
                    style="background:none; border:none; box-shadow:none;">🎉</button>
            </div>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="p2p-modal-backdrop p2p-hidden" id="modalPopup">
        <div class="p2p-modal">
            <div style="font-size: 48px;" id="modalEmoji">🏆</div>
            <h2 style="font-size: 22px; margin: 6px 0;" id="modalTitle">ПОБЕДА!</h2>
            <p style="font-size: 13px; color: var(--p2p-text-muted); margin-bottom: 14px;" id="modalDesc">Весь вражеский
                флот уничтожен!</p>
            <button class="p2p-btn p2p-btn-success" id="btnRestart">В главное меню</button>
        </div>
    </div>

    <script>
        /* 1. AUDIO */
        const AudioFX = {
            ctx: null, muted: false,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            playSplash() {
                if (this.muted || !this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.15, buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate), data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            },
            playHit() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            },
            playSunk() {
                this.playHit();
                setTimeout(() => {
                    if (this.muted || !this.ctx) return;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.4);
                }, 150);
            },
            playPop() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playVictory() {
                if (this.muted || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => {
                        if (this.muted || !this.ctx) return;
                        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.3, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.35);
                    }, i * 120);
                });
            },
            playDefeat() {
                if (this.muted || !this.ctx) return;
                [440, 415.3, 392, 349.2].forEach((f, i) => {
                    setTimeout(() => {
                        if (this.muted || !this.ctx) return;
                        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.25, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3);
                    }, i * 180);
                });
            }
        };
        window.addEventListener('click', () => AudioFX.init(), { once: true });

        /* 2. STATE & NET */
        const GRID_SIZE = 10;
        const FLEET_SCHEMA = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];

        let isBotMode = false;
        let isHorizontal = true;
        let myShips = [];
        let enemyShips = [];
        let myTurn = true;
        let enemyFleetCount = 10;
        let myFleetCount = 10;
        let botTargetStack = [];
        let opponentReady = false;

        const net = new P2PNet({ appPrefix: 'battleship', mode: 'duo' });

        const appContainer = document.getElementById('appContainer');
        const toast = document.getElementById('toast');
        const netStatus = document.getElementById('netStatus');
        const btnSoundToggle = document.getElementById('btnSoundToggle');
        const screenMenu = document.getElementById('screenMenu');
        const screenLobby = document.getElementById('screenLobby');
        const screenPlacement = document.getElementById('screenPlacement');
        const screenBattle = document.getElementById('screenBattle');
        const placementGrid = document.getElementById('placementGrid');
        const enemyRadarGrid = document.getElementById('enemyRadarGrid');
        const myFleetGrid = document.getElementById('myFleetGrid');
        const btnRotate = document.getElementById('btnRotate');
        const btnAutoPlace = document.getElementById('btnAutoPlace');
        const btnClearPlacement = document.getElementById('btnClearPlacement');
        const btnReadyToFight = document.getElementById('btnReadyToFight');
        const displayRoomCode = document.getElementById('displayRoomCode');
        const inputRoomCode = document.getElementById('inputRoomCode');
        const turnBanner = document.getElementById('turnBanner');
        const myFleetAlive = document.getElementById('myFleetAlive');
        const enemyFleetAlive = document.getElementById('enemyFleetAlive');
        const tabEnemy = document.getElementById('tabEnemy');
        const tabMy = document.getElementById('tabMy');
        const modalPopup = document.getElementById('modalPopup');

        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000); }
        function showScreen(screen) { [screenMenu, screenLobby, screenPlacement, screenBattle].forEach(s => s.classList.add('p2p-hidden')); screen.classList.remove('p2p-hidden'); }

        btnSoundToggle.onclick = () => { AudioFX.init(); AudioFX.muted = !AudioFX.muted; btnSoundToggle.textContent = AudioFX.muted ? "🔇 Выкл" : "🔊 Вкл"; };

        /* 3. FLEET PLACEMENT */
        function getShipCells(startIndex, size, horizontal) {
            const cells = [], r = Math.floor(startIndex / GRID_SIZE), c = startIndex % GRID_SIZE;
            for (let i = 0; i < size; i++) {
                const nr = horizontal ? r : r + i, nc = horizontal ? c + i : c;
                if (nr >= GRID_SIZE || nc >= GRID_SIZE) return null;
                cells.push(nr * GRID_SIZE + nc);
            }
            return cells;
        }

        function isValidPlacement(cells, existingShips) {
            if (!cells) return false;
            const occupied = new Set();
            existingShips.forEach(s => {
                s.cells.forEach(idx => {
                    const r = Math.floor(idx / GRID_SIZE), c = idx % GRID_SIZE;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) occupied.add(nr * GRID_SIZE + nc);
                        }
                    }
                });
            });
            return cells.every(c => !occupied.has(c));
        }

        function generateRandomFleet() {
            const ships = [];
            FLEET_SCHEMA.forEach((size, idx) => {
                let placed = false, attempts = 0;
                while (!placed && attempts < 500) {
                    attempts++;
                    const horiz = Math.random() > 0.5;
                    const startIndex = Math.floor(Math.random() * 100);
                    const cells = getShipCells(startIndex, size, horiz);
                    if (cells && isValidPlacement(cells, ships)) {
                        ships.push({ id: idx, size, cells, hits: [] });
                        placed = true;
                    }
                }
            });
            return ships;
        }

        function initPlacementScreen() {
            myShips = [];
            isHorizontal = true;
            opponentReady = false;
            btnRotate.textContent = "🔄 ГОРИЗОНТ.";
            renderPlacementGrid();
            updatePlacementUI();
            showScreen(screenPlacement);
        }

        btnRotate.onclick = () => { AudioFX.playPop(); isHorizontal = !isHorizontal; btnRotate.textContent = isHorizontal ? "🔄 ГОРИЗОНТ." : "🔄 ВЕРТИКАЛЬ"; };
        btnAutoPlace.onclick = () => { AudioFX.playPop(); myShips = generateRandomFleet(); renderPlacementGrid(); updatePlacementUI(); };
        btnClearPlacement.onclick = () => { AudioFX.playPop(); myShips = []; renderPlacementGrid(); updatePlacementUI(); };

        function updatePlacementUI() {
            const placedSizes = myShips.map(s => s.size);
            const countSize = (sz) => FLEET_SCHEMA.filter(s => s === sz).length - placedSizes.filter(s => s === sz).length;
            document.getElementById('placementCounter').innerHTML = `
                <span>4x■: ${countSize(4)}</span><span>3x■: ${countSize(3)}</span><span>2x■: ${countSize(2)}</span><span>1x■: ${countSize(1)}</span>
            `;
            const isFull = myShips.length === FLEET_SCHEMA.length;
            btnReadyToFight.disabled = !isFull;
            btnReadyToFight.style.opacity = isFull ? "1" : "0.5";
        }

        function getNextShipSizeToPlace() {
            const placedSizes = myShips.map(s => s.size);
            for (let size of FLEET_SCHEMA) {
                if (placedSizes.filter(s => s === size).length < FLEET_SCHEMA.filter(s => s === size).length) return size;
            }
            return null;
        }

        function renderPlacementGrid() {
            placementGrid.innerHTML = "";
            const shipCellMap = new Set();
            myShips.forEach(s => s.cells.forEach(c => shipCellMap.add(c)));

            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'p2p-cell' + (shipCellMap.has(i) ? ' active-item' : '');

                cell.onmouseenter = () => {
                    const nextSize = getNextShipSizeToPlace();
                    if (!nextSize) return;
                    const candidate = getShipCells(i, nextSize, isHorizontal);
                    if (candidate) {
                        const valid = isValidPlacement(candidate, myShips);
                        candidate.forEach(idx => {
                            const el = placementGrid.children[idx];
                            if (el) el.style.background = valid ? 'rgba(108, 92, 231, 0.7)' : 'rgba(255, 118, 117, 0.7)';
                        });
                    }
                };
                cell.onmouseleave = () => {
                    Array.from(placementGrid.children).forEach((el, idx) => {
                        el.style.background = '';
                    });
                };
                cell.onclick = () => {
                    const clickedIdx = myShips.findIndex(s => s.cells.includes(i));
                    if (clickedIdx !== -1) {
                        AudioFX.playPop(); myShips.splice(clickedIdx, 1);
                        renderPlacementGrid(); updatePlacementUI(); return;
                    }
                    const nextSize = getNextShipSizeToPlace();
                    if (!nextSize) return;
                    const candidate = getShipCells(i, nextSize, isHorizontal);
                    if (candidate && isValidPlacement(candidate, myShips)) {
                        AudioFX.playPop();
                        myShips.push({ id: myShips.length, size: nextSize, cells: candidate, hits: [] });
                        renderPlacementGrid(); updatePlacementUI();
                    } else AudioFX.playHit();
                };
                placementGrid.appendChild(cell);
            }
        }

        /* 4. BATTLE */
        btnReadyToFight.onclick = () => {
            AudioFX.playPop();
            if (isBotMode) {
                enemyShips = generateRandomFleet();
                startBattle();
            } else {
                net.send({ type: 'READY_FLEET' });
                if (opponentReady) startBattle();
                else showToast("Флот готов! Ждем соперника...");
            }
        };

        function startBattle() {
            showScreen(screenBattle);
            myFleetCount = 10; enemyFleetCount = 10;
            myFleetAlive.textContent = "10"; enemyFleetAlive.textContent = "10";
            botTargetStack = [];
            renderBattleGrids();
            myTurn = isBotMode ? true : net.isHost;
            updateTurnUI();
        }

        function renderBattleGrids() {
            enemyRadarGrid.innerHTML = "";
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'p2p-cell';
                cell.onclick = () => handleRadarShot(i);
                enemyRadarGrid.appendChild(cell);
            }

            myFleetGrid.innerHTML = "";
            const myShipCells = new Set();
            myShips.forEach(s => s.cells.forEach(c => myShipCells.add(c)));
            for (let i = 0; i < 100; i++) {
                const cell = document.createElement('div');
                cell.className = 'p2p-cell' + (myShipCells.has(i) ? ' active-item' : '');
                myFleetGrid.appendChild(cell);
            }
        }

        function updateTurnUI() {
            turnBanner.textContent = myTurn ? "🎯 ТВОЙ ВЫСТРЕЛ!" : "⏳ ХОД ВРАГА...";
            turnBanner.className = myTurn ? "p2p-badge p2p-badge-online" : "p2p-badge p2p-badge-waiting";
            turnBanner.style.flex = "1";
        }

        tabEnemy.onclick = () => { tabEnemy.classList.add('active'); tabMy.classList.remove('active'); enemyRadarGrid.classList.remove('p2p-hidden'); myFleetGrid.classList.add('p2p-hidden'); };
        tabMy.onclick = () => { tabMy.classList.add('active'); tabEnemy.classList.remove('active'); myFleetGrid.classList.remove('p2p-hidden'); enemyRadarGrid.classList.add('p2p-hidden'); };

        function getShipPerimeter(cells) {
            const perimeter = new Set();
            cells.forEach(idx => {
                const r = Math.floor(idx / GRID_SIZE), c = idx % GRID_SIZE;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                            const pIdx = nr * GRID_SIZE + nc;
                            if (!cells.includes(pIdx)) perimeter.add(pIdx);
                        }
                    }
                }
            });
            return Array.from(perimeter);
        }

        function handleRadarShot(cellIdx) {
            if (!myTurn) return showToast("Сейчас ход соперника!");
            const cellEl = enemyRadarGrid.children[cellIdx];
            if (cellEl.classList.contains('hit') || cellEl.classList.contains('miss')) return;

            if (isBotMode) {
                const hitShip = enemyShips.find(s => s.cells.includes(cellIdx));
                if (hitShip) {
                    hitShip.hits.push(cellIdx); cellEl.classList.add('hit');
                    const isSunk = hitShip.hits.length === hitShip.size;
                    if (isSunk) {
                        AudioFX.playSunk(); enemyFleetCount--; enemyFleetAlive.textContent = enemyFleetCount;
                        hitShip.cells.forEach(c => {
                            enemyRadarGrid.children[c].className = 'p2p-cell hit';
                            enemyRadarGrid.children[c].style.background = 'var(--p2p-color-primary)';
                        });
                        getShipPerimeter(hitShip.cells).forEach(p => enemyRadarGrid.children[p].classList.add('miss'));
                        if (enemyFleetCount === 0) { AudioFX.playVictory(); return showEndGame(true, "Ты уничтожил весь вражеский флот!"); }
                    } else AudioFX.playHit();
                } else {
                    AudioFX.playSplash(); cellEl.classList.add('miss');
                    myTurn = false; updateTurnUI(); setTimeout(botTakeTurn, 800);
                }
            } else {
                net.send({ type: 'SHOOT', cell: cellIdx });
            }
        }

        function botTakeTurn() {
            if (myFleetCount === 0) return;
            let targetIdx;
            while (botTargetStack.length > 0) {
                const candidate = botTargetStack.pop();
                const el = myFleetGrid.children[candidate];
                if (!el.classList.contains('hit') && !el.classList.contains('miss')) { targetIdx = candidate; break; }
            }
            if (targetIdx === undefined) {
                const unshot = [];
                for (let i = 0; i < 100; i++) {
                    const el = myFleetGrid.children[i];
                    if (!el.classList.contains('hit') && !el.classList.contains('miss')) unshot.push(i);
                }
                if (unshot.length === 0) return;
                targetIdx = unshot[Math.floor(Math.random() * unshot.length)];
            }

            const cellEl = myFleetGrid.children[targetIdx];
            const hitShip = myShips.find(s => s.cells.includes(targetIdx));

            if (hitShip) {
                hitShip.hits.push(targetIdx); cellEl.className = 'p2p-cell hit';
                const isSunk = hitShip.hits.length === hitShip.size;
                if (isSunk) {
                    AudioFX.playSunk(); myFleetCount--; myFleetAlive.textContent = myFleetCount;
                    hitShip.cells.forEach(c => {
                        myFleetGrid.children[c].className = 'p2p-cell hit';
                        myFleetGrid.children[c].style.background = 'var(--p2p-color-primary)';
                    });
                    getShipPerimeter(hitShip.cells).forEach(p => myFleetGrid.children[p].classList.add('miss'));
                    botTargetStack = [];
                    if (myFleetCount === 0) { AudioFX.playDefeat(); return showEndGame(false, "Твой флот полностью потоплен!"); }
                } else {
                    AudioFX.playHit();
                    const r = Math.floor(targetIdx / GRID_SIZE), c = targetIdx % GRID_SIZE;
                    [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => {
                        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                            const nIdx = nr * GRID_SIZE + nc;
                            const nEl = myFleetGrid.children[nIdx];
                            if (!nEl.classList.contains('hit') && !nEl.classList.contains('miss')) botTargetStack.push(nIdx);
                        }
                    });
                }
                setTimeout(botTakeTurn, 700);
            } else {
                AudioFX.playSplash(); cellEl.classList.add('miss');
                myTurn = true; updateTurnUI();
            }
        }

        /* 5. NET EVENT LISTENERS */
        net.on('status', ({ online }) => {
            netStatus.classList.toggle('p2p-hidden', !online);
            netStatus.textContent = online ? "🟢 ОНЛАЙН" : "🟡 СЕТЬ...";
        });

        net.on('room-created', ({ roomId }) => {
            displayRoomCode.textContent = roomId;
            showScreen(screenLobby);
        });

        net.on('peer-connected', () => {
            showToast("Соперник подключился!");
            initPlacementScreen();
        });

        net.on('peer-disconnected', () => {
            showToast("Соперник отключился");
        });

        net.on('data', (data) => {
            if (data.type === 'READY_FLEET') {
                opponentReady = true;
                if (myShips.length === FLEET_SCHEMA.length && !screenPlacement.classList.contains('p2p-hidden') && !btnReadyToFight.disabled) {
                    startBattle();
                }
            } else if (data.type === 'SHOOT') {
                const cellIdx = data.cell;
                const cellEl = myFleetGrid.children[cellIdx];
                const hitShip = myShips.find(s => s.cells.includes(cellIdx));

                if (hitShip) {
                    hitShip.hits.push(cellIdx);
                    cellEl.className = 'p2p-cell hit';
                    const isSunk = hitShip.hits.length === hitShip.size;
                    let perimeter = [];

                    if (isSunk) {
                        AudioFX.playSunk(); myFleetCount--; myFleetAlive.textContent = myFleetCount;
                        hitShip.cells.forEach(c => {
                            myFleetGrid.children[c].className = 'p2p-cell hit';
                            myFleetGrid.children[c].style.background = 'var(--p2p-color-primary)';
                        });
                        perimeter = getShipPerimeter(hitShip.cells);
                        perimeter.forEach(p => myFleetGrid.children[p].classList.add('miss'));
                    } else AudioFX.playHit();

                    net.send({
                        type: 'SHOOT_RESULT', cell: cellIdx, hit: true, sunk: isSunk,
                        shipCells: hitShip.cells, perimeter, allDead: myFleetCount === 0
                    });

                    if (myFleetCount === 0) { AudioFX.playDefeat(); showEndGame(false, "Твой флот полностью потоплен!"); }
                } else {
                    AudioFX.playSplash(); cellEl.classList.add('miss');
                    myTurn = true; updateTurnUI();
                    net.send({ type: 'SHOOT_RESULT', cell: cellIdx, hit: false });
                }
            } else if (data.type === 'SHOOT_RESULT') {
                const cellEl = enemyRadarGrid.children[data.cell];
                if (data.hit) {
                    cellEl.classList.add('hit');
                    if (data.sunk) {
                        AudioFX.playSunk(); enemyFleetCount--; enemyFleetAlive.textContent = enemyFleetCount;
                        data.shipCells.forEach(c => {
                            enemyRadarGrid.children[c].className = 'p2p-cell hit';
                            enemyRadarGrid.children[c].style.background = 'var(--p2p-color-primary)';
                        });
                        data.perimeter.forEach(p => enemyRadarGrid.children[p].classList.add('miss'));
                        if (data.allDead) { AudioFX.playVictory(); showEndGame(true, "Ты уничтожил весь вражеский флот!"); }
                    } else AudioFX.playHit();
                } else {
                    AudioFX.playSplash(); cellEl.classList.add('miss');
                    myTurn = false; updateTurnUI();
                }
            } else if (data.type === 'EMOJI') {
                spawnFloatingEmoji(data.emoji, true);
            } else if (data.type === 'SURRENDER') {
                AudioFX.playVictory(); showEndGame(true, "Соперник сдался и покинул бой!");
            }
        });

        net.on('error', (err) => {
            alert(err.type === 'peer-unavailable' ? "Комната не найдена!" : "Ошибка сети: " + err.type);
            leaveGame();
        });

        /* 6. UI ACTIONS */
        function spawnFloatingEmoji(emoji, isOpponent = false) {
            AudioFX.playPop();
            const el = document.createElement('div');
            el.className = 'p2p-float-item'; el.textContent = emoji;
            el.style.left = (isOpponent ? 70 : 25) + (Math.random() * 10 - 5) + '%';
            el.style.bottom = '40%';
            appContainer.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        document.querySelectorAll('.emoji-btn').forEach(btn => {
            btn.onclick = () => {
                const emoji = btn.dataset.emoji;
                spawnFloatingEmoji(emoji, false);
                if (!isBotMode) net.send({ type: 'EMOJI', emoji });
                else if (Math.random() > 0.4) setTimeout(() => spawnFloatingEmoji(['🤖', '🌊', '💥', '🎯', '🤡'][Math.floor(Math.random() * 5)], true), 700);
            };
        });

        document.getElementById('btnSurrender').onclick = () => {
            if (confirm("Выйти в меню? Текущий бой будет прерван.")) {
                AudioFX.playHit();
                if (!isBotMode) net.send({ type: 'SURRENDER' });
                leaveGame();
            }
        };

        function leaveGame() {
            net.destroy();
            netStatus.classList.add('p2p-hidden');
            showScreen(screenMenu);
        }

        document.getElementById('btnPlayBot').onclick = () => {
            AudioFX.playPop(); isBotMode = true;
            netStatus.classList.add('p2p-hidden');
            initPlacementScreen();
        };

        document.getElementById('btnCreateRoom').onclick = () => {
            AudioFX.playPop(); isBotMode = false;
            net.createRoom().catch(err => alert("Ошибка: " + err.message));
        };

        document.getElementById('btnJoinRoom').onclick = () => {
            AudioFX.playPop();
            const code = inputRoomCode.value.trim();
            if (code.length < 3) return showToast("Введите код комнаты!");
            isBotMode = false;
            net.joinRoom(code).catch(err => alert("Не удалось войти: " + err.message));
        };

        displayRoomCode.onclick = () => { AudioFX.playPop(); navigator.clipboard.writeText(net.roomId); showToast("Скопировано!"); };
        document.getElementById('btnCopyLink').onclick = () => { AudioFX.playPop(); navigator.clipboard.writeText(net.getShareUrl()); showToast("Ссылка скопирована!"); };
        document.getElementById('btnLeaveLobby').onclick = leaveGame;

        function showEndGame(won, msg) {
            document.getElementById('modalEmoji').textContent = won ? "🏆" : "💥";
            document.getElementById('modalTitle').textContent = won ? "ПОБЕДА!" : "ПОРАЖЕНИЕ";
            document.getElementById('modalDesc').textContent = msg;
            modalPopup.classList.remove('p2p-hidden');
        }

        document.getElementById('btnRestart').onclick = () => { window.location.hash = ""; location.reload(); };

        window.addEventListener('load', () => {
            if (window.location.hash.length > 1) {
                inputRoomCode.value = P2PNet.cleanCode(window.location.hash.substring(1));
            }
        });
    </script>
</body>

</html>
