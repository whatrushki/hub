<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DROPZONE // P2P Передача файлов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../libs/css/p2p-ui.css">
    <link rel="stylesheet" href="../libs/css/theme-cartoon.css" id="themeStylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../libs/code/p2p-net.js"></script>
</head>

<body>
    <div class="p2p-toast" id="toast">Уведомление</div>

    <div class="p2p-app wide">
        <header class="p2p-header">
            <div class="p2p-logo">📦 DROPZONE</div>
            <div class="p2p-header-actions">
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnLogToggle">📜 Лог</button>
                <button class="p2p-btn p2p-btn-neutral p2p-btn-icon" id="btnSoundToggle">🔊 Вкл</button>
                <div class="p2p-badge p2p-badge-waiting" id="netBadge">🟡 СЕТЬ...</div>
            </div>
        </header>

        <div class="p2p-tabs">
            <button class="p2p-tab active" id="tabSend">🚀 Отправить</button>
            <button class="p2p-tab" id="tabReceive">📥 Принять</button>
        </div>

        <!-- РЕЖИМ 1: ОТПРАВИТЬ -->
        <div class="p2p-card" id="cardSend">
            <div class="p2p-grid-2col">
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div class="p2p-dropzone" id="dropzone">
                        <div style="font-size: 36px;">📁</div>
                        <div style="font-size: 15px; font-weight: 700;">Перетащи файлы сюда</div>
                        <div style="font-size: 12px; color: var(--p2p-text-muted);">или нажми для выбора</div>
                        <input type="file" id="fileInput" multiple class="p2p-hidden">
                    </div>

                    <div
                        style="background: #fff; border: var(--p2p-border-width) solid var(--p2p-border); border-radius: var(--p2p-radius-md); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px;">
                        <div style="font-size: 12px; font-weight: 700; color: var(--p2p-text-muted);">Код комнаты:</div>
                        <div style="font-size: 22px; font-weight: 900; letter-spacing: 3px; font-family: var(--p2p-font-mono); color: var(--p2p-color-primary);"
                            id="displayCode">...</div>
                        <div id="qrcode"
                            style="min-height: 120px; display: flex; align-items: center; justify-content: center;">
                        </div>
                    </div>

                    <button class="p2p-btn p2p-btn-warning" id="btnCopyLink">📋 Копировать ссылку</button>
                </div>

                <div>
                    <div
                        style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--p2p-text-muted); padding: 0 4px;">
                        <span id="queueCount">Всего: 0 файлов</span>
                        <span id="queueTotalSize">0 MB</span>
                    </div>
                    <div id="senderQueueList"
                        style="display: flex; flex-direction: column; gap: 8px; max-height: 290px; overflow-y: auto; margin: 8px 0; padding-right: 6px;">
                        <div
                            style="text-align: center; color: var(--p2p-text-muted); font-size: 13px; padding: 40px 0;">
                            Очередь пуста.<br>Добавьте файлы слева!
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- РЕЖИМ 2: ПРИНЯТЬ -->
        <div class="p2p-card p2p-hidden" id="cardReceive">
            <div class="p2p-grid-2col">
                <div style="display: flex; flex-direction: column; gap: 10px; justify-content: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">ПОДКЛЮЧЕНИЕ</div>
                        <div style="font-size: 12px; color: var(--p2p-text-muted);">Введи 5-значный код отправителя:
                        </div>
                    </div>
                    <input type="text" class="p2p-input p2p-input-code" id="inputRoomCode" placeholder="КОД"
                        maxlength="5">
                    <button class="p2p-btn p2p-btn-info" id="btnConnect">⚡ Подключиться</button>
                </div>

                <div>
                    <div
                        style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--p2p-text-muted); padding: 0 4px;">
                        <span id="receiveQueueCount">Входящие: 0 файлов</span>
                        <span id="receiveQueueTotalSize">0 MB</span>
                    </div>
                    <div id="receiverQueueList"
                        style="display: flex; flex-direction: column; gap: 8px; max-height: 290px; overflow-y: auto; margin: 8px 0; padding-right: 6px;">
                        <div
                            style="text-align: center; color: var(--p2p-text-muted); font-size: 13px; padding: 40px 0;">
                            Ожидание подключения к отправителю...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOG CONSOLE -->
        <div class="p2p-card p2p-hidden" id="logConsole"
            style="background: #222f3e; color: #1dd1a1; font-family: monospace; font-size: 11px; padding: 10px 14px; max-height: 120px; overflow-y: auto; user-select: text;">
            LOG: Инициализация системы...
        </div>
    </div>

    <script>
        /* 1. AUDIO ENGINE */
        const AudioFX = {
            ctx: null, muted: false,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playPop() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playSuccess() {
                if (this.muted || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => {
                    if (this.muted || !this.ctx) return;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.3);
                }, i * 90));
            }
        };
        window.addEventListener('click', () => AudioFX.init(), { once: true });

        /* 2. LOGGER */
        const logConsole = document.getElementById('logConsole');
        document.getElementById('btnLogToggle').onclick = () => logConsole.classList.toggle('p2p-hidden');
        function sysLog(text) {
            const time = new Date().toTimeString().split(' ')[0];
            logConsole.innerHTML = `[${time}] ${text}<br>` + logConsole.innerHTML;
        }

        /* 3. STATE & NET */
        const net = new P2PNet({ appPrefix: 'dropzone', mode: 'duo' });

        let senderFiles = [], isSenderBusy = false;
        let receiverFiles = {};

        const toast = document.getElementById('toast');
        const netBadge = document.getElementById('netBadge');
        const tabSend = document.getElementById('tabSend');
        const tabReceive = document.getElementById('tabReceive');
        const cardSend = document.getElementById('cardSend');
        const cardReceive = document.getElementById('cardReceive');
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const senderQueueList = document.getElementById('senderQueueList');
        const queueCount = document.getElementById('queueCount');
        const queueTotalSize = document.getElementById('queueTotalSize');
        const displayCode = document.getElementById('displayCode');
        const inputRoomCode = document.getElementById('inputRoomCode');
        const btnConnect = document.getElementById('btnConnect');
        const receiverQueueList = document.getElementById('receiverQueueList');
        const receiveQueueCount = document.getElementById('receiveQueueCount');
        const receiveQueueTotalSize = document.getElementById('receiveQueueTotalSize');

        function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        tabSend.onclick = () => {
            AudioFX.playPop();
            tabSend.classList.add('active'); tabReceive.classList.remove('active');
            cardSend.classList.remove('p2p-hidden'); cardReceive.classList.add('p2p-hidden');
            if (!net.roomId) createSenderRoom();
        };

        tabReceive.onclick = () => {
            AudioFX.playPop();
            tabReceive.classList.add('active'); tabSend.classList.remove('active');
            cardReceive.classList.remove('p2p-hidden'); cardSend.classList.add('p2p-hidden');
            net.destroy();
            netBadge.innerHTML = "⚪ ОЖИДАНИЕ";
            netBadge.className = "p2p-badge p2p-badge-waiting";
        };

        function renderQRCode(url) {
            const qrEl = document.getElementById('qrcode'); qrEl.innerHTML = "";
            try { new QRCode(qrEl, { text: url, width: 120, height: 120, colorDark: "#222f3e", colorLight: "#ffffff" }); } catch (e) { }
        }

        async function createSenderRoom() {
            try {
                sysLog("Создание комнаты отправителя...");
                const code = await net.createRoom();
                displayCode.textContent = code;
                renderQRCode(net.getShareUrl());
                netBadge.innerHTML = "🟡 ЖДЕМ ПИРА";
                netBadge.className = "p2p-badge p2p-badge-waiting";
            } catch (err) {
                sysLog("Ошибка создания: " + err.message);
            }
        }

        document.getElementById('btnCopyLink').onclick = () => {
            AudioFX.playPop();
            navigator.clipboard.writeText(net.getShareUrl()).then(() => showToast("Ссылка скопирована!"));
        };

        /* 4. QUEUE & SENDING */
        dropzone.onclick = () => fileInput.click();
        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
        dropzone.ondragleave = () => dropzone.classList.remove('dragover');
        dropzone.ondrop = (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); if (e.dataTransfer.files.length > 0) addFilesToQueue(Array.from(e.dataTransfer.files)); };
        fileInput.onchange = () => { if (fileInput.files.length > 0) { addFilesToQueue(Array.from(fileInput.files)); fileInput.value = ''; } };

        function addFilesToQueue(files) {
            AudioFX.playPop();
            files.forEach(f => {
                senderFiles.push({
                    id: 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    file: f, name: f.name, size: f.size, type: f.type || 'application/octet-stream', status: 'queued'
                });
            });
            renderSenderQueue();
            runSenderWorker();
        }

        function renderSenderQueue() {
            if (senderFiles.length === 0) {
                senderQueueList.innerHTML = `<div style="text-align: center; color: var(--p2p-text-muted); font-size: 13px; padding: 40px 0;">Очередь пуста.<br>Добавьте файлы слева!</div>`;
                queueCount.textContent = `Всего: 0 файлов`; queueTotalSize.textContent = `0 MB`; return;
            }
            senderQueueList.innerHTML = "";
            let totalBytes = 0;
            senderFiles.forEach(f => {
                totalBytes += f.size;
                const itemEl = document.createElement('div');
                itemEl.style.background = "var(--p2p-surface-muted)";
                itemEl.style.border = "2px solid var(--p2p-border)";
                itemEl.style.borderRadius = "var(--p2p-radius-sm)";
                itemEl.style.padding = "8px 12px";
                itemEl.style.display = "flex";
                itemEl.style.flexDirection = "column";
                itemEl.style.gap = "6px";

                itemEl.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                        <div style="font-size: 22px;">📄</div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${f.name}</div>
                            <div style="font-size: 11px; color: var(--p2p-text-muted);">${formatBytes(f.size)}</div>
                        </div>
                        <span class="p2p-badge ${f.status === 'sent' ? 'p2p-badge-online' : 'p2p-badge-waiting'}" id="senderBadge-${f.id}">
                            ${f.status === 'sent' ? '✅ Отправлен' : '⏳ В очереди'}
                        </span>
                    </div>
                    <div class="p2p-progress-track">
                        <div class="p2p-progress-fill" id="senderProgress-${f.id}" style="width: ${f.status === 'sent' ? '100%' : '0%'}"></div>
                    </div>
                `;
                senderQueueList.appendChild(itemEl);
            });
            queueCount.textContent = `Всего: ${senderFiles.length} файлов`;
            queueTotalSize.textContent = formatBytes(totalBytes);
        }

        async function runSenderWorker() {
            if (isSenderBusy || net.peers.size === 0) return;
            isSenderBusy = true;

            while (true) {
                const item = senderFiles.find(f => f.status === 'queued');
                if (!item) break;

                item.status = 'sending';
                const badge = document.getElementById(`senderBadge-${item.id}`);
                const progress = document.getElementById(`senderProgress-${item.id}`);
                if (badge) { badge.className = 'p2p-badge p2p-badge-active'; badge.textContent = '🚀 Отправка...'; }

                sysLog(`Отправка: ${item.name}`);
                await net.sendFile(item.file, null, ({ percent }) => {
                    if (progress) progress.style.width = percent + '%';
                });

                item.status = 'sent';
                if (badge) { badge.className = 'p2p-badge p2p-badge-online'; badge.textContent = '✅ Отправлен'; }
                if (progress) progress.style.width = '100%';
                sysLog(`Успешно отправлен: ${item.name}`);
            }

            isSenderBusy = false;
            AudioFX.playSuccess();
            showToast("Все файлы отправлены!");
        }

        /* 5. NET EVENTS */
        net.on('status', ({ online }) => {
            netBadge.innerHTML = online ? "🟢 ОНЛАЙН" : "🟡 СЕТЬ...";
            netBadge.className = online ? "p2p-badge p2p-badge-online" : "p2p-badge p2p-badge-waiting";
        });

        net.on('peer-connected', () => {
            AudioFX.playPop();
            netBadge.innerHTML = "🟢 ПОДКЛЮЧЕНО";
            netBadge.className = "p2p-badge p2p-badge-online";
            showToast("Связь установлена!");
            sysLog("P2P Канал открыт!");
            runSenderWorker();
        });

        net.on('peer-disconnected', () => {
            netBadge.innerHTML = "🔴 ОТКЛЮЧЕНО";
            netBadge.className = "p2p-badge p2p-badge-offline";
            showToast("Пир отключился");
        });

        net.on('file-start', (packet) => {
            receiverFiles[packet.id] = { id: packet.id, name: packet.name, size: packet.size, status: 'receiving' };
            renderReceiverQueue();
        });

        net.on('file-progress', ({ fileId, percent }) => {
            const progress = document.getElementById(`receiverProgress-${fileId}`);
            const badge = document.getElementById(`receiverBadge-${fileId}`);
            if (progress) progress.style.width = percent + '%';
            if (badge) badge.textContent = `🚀 ${percent}%`;
        });

        net.on('file-received', (fileItem) => {
            AudioFX.playSuccess();
            sysLog(`Получен файл: ${fileItem.name}`);
            const slot = document.getElementById(`receiverBadgeSlot-${fileItem.id}`);
            if (slot) {
                slot.innerHTML = `<a href="${fileItem.url}" download="${fileItem.name}" class="p2p-badge p2p-badge-online" style="cursor:pointer;">💾 Скачать</a>`;
            }
            const progress = document.getElementById(`receiverProgress-${fileItem.id}`);
            if (progress) progress.style.width = '100%';

            // Авто-скачивание
            const a = document.createElement('a');
            a.href = fileItem.url; a.download = fileItem.name; document.body.appendChild(a); a.click();
            setTimeout(() => document.body.removeChild(a), 500);
        });

        function renderReceiverQueue() {
            const files = Object.values(receiverFiles);
            if (files.length === 0) {
                receiverQueueList.innerHTML = `<div style="text-align: center; color: var(--p2p-text-muted); font-size: 13px; padding: 40px 0;">Ожидание файлов от отправителя...</div>`;
                return;
            }
            receiverQueueList.innerHTML = "";
            let totalBytes = 0;
            files.forEach(f => {
                totalBytes += f.size;
                const itemEl = document.createElement('div');
                itemEl.style.background = "var(--p2p-surface-muted)";
                itemEl.style.border = "2px solid var(--p2p-border)";
                itemEl.style.borderRadius = "var(--p2p-radius-sm)";
                itemEl.style.padding = "8px 12px";
                itemEl.style.display = "flex";
                itemEl.style.flexDirection = "column";
                itemEl.style.gap = "6px";

                itemEl.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px; overflow: hidden;">
                        <div style="font-size: 22px;">📄</div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${f.name}</div>
                            <div style="font-size: 11px; color: var(--p2p-text-muted);">${formatBytes(f.size)}</div>
                        </div>
                        <div id="receiverBadgeSlot-${f.id}">
                            <span class="p2p-badge p2p-badge-active" id="receiverBadge-${f.id}">🚀 Получение...</span>
                        </div>
                    </div>
                    <div class="p2p-progress-track">
                        <div class="p2p-progress-fill" id="receiverProgress-${f.id}" style="width: 0%"></div>
                    </div>
                `;
                receiverQueueList.appendChild(itemEl);
            });
            receiveQueueCount.textContent = `Входящие: ${files.length} файлов`;
            receiveQueueTotalSize.textContent = formatBytes(totalBytes);
        }

        btnConnect.onclick = () => {
            const code = inputRoomCode.value.trim();
            if (code.length < 3) return showToast("Введите код!");
            sysLog(`Подключение к комнате ${code}...`);
            net.joinRoom(code).catch(err => {
                sysLog("Ошибка: " + err.message);
                showToast("Не удалось подключиться к отправителю");
            });
        };

        window.addEventListener('load', () => {
            if (window.location.hash.length > 1) {
                tabReceive.click();
                inputRoomCode.value = P2PNet.cleanCode(window.location.hash.substring(1));
                btnConnect.click();
            } else {
                createSenderRoom();
            }
        });
    </script>
</body>

</html>
