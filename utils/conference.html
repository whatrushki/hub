<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DROPCONF // Studio Mesh Edition</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../libs/code/p2p-net.js"></script>

    <style>
        :root {
            --bg-base: #131314;
            --bg-surface: #1e1f20;
            --bg-surface-elevated: #282a2c;
            --bg-surface-hover: #333537;
            --border-subtle: #37393b;
            --border-focus: #a8c7fa;

            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --text-muted: #8e918f;

            --google-blue: #a8c7fa;
            --google-blue-hover: #8ab4f8;
            --google-blue-container: rgba(168, 199, 250, 0.14);
            --google-green: #81c995;
            --google-green-container: rgba(129, 201, 149, 0.14);
            --google-red: #f28b82;
            --google-red-container: rgba(242, 139, 130, 0.16);
            --google-yellow: #fdd663;

            --gemini-gradient: linear-gradient(135deg, #7cacf8 0%, #a8c7fa 50%, #d3e3fd 100%);

            --radius-xs: 6px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: var(--font-sans);
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }

        .material-symbols-outlined {
            font-size: 20px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .conf-app {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
        }

        /* 1. ХЕДЕР */
        .studio-header {
            height: 48px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 30;
        }

        .studio-logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gemini-sparkle {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 18px;
        }

        .studio-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .studio-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .studio-badge.online {
            border-color: rgba(129, 201, 149, 0.4);
            color: var(--google-green);
        }

        .studio-badge.reconnecting {
            border-color: rgba(253, 214, 99, 0.4);
            color: var(--google-yellow);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--google-yellow);
        }

        .studio-badge.online .status-dot {
            background: var(--google-green);
            box-shadow: 0 0 6px var(--google-green);
        }

        /* 2. РАБОЧАЯ ОБЛАСТЬ */
        .conf-main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        .conf-video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        /* СЕТКА ВИДЕОКАРТОЧЕК */
        .conf-grid {
            flex: 1;
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            grid-auto-rows: 1fr;
            align-content: stretch;
            overflow-y: auto;
            min-height: 0;
            width: 100%;
            height: 100%;
        }

        .conf-grid.count-1 {
            grid-template-columns: 1fr !important;
            grid-template-rows: 1fr !important;
        }

        .conf-grid.count-2 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
        }

        .conf-grid.count-3,
        .conf-grid.count-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        @media (max-width: 768px) {
            .conf-video-container {
                padding: 4px;
            }

            .conf-grid {
                display: flex;
                flex-direction: column;
                gap: 6px;
                overflow-y: auto;
            }

            .conf-grid.count-1 .video-tile {
                flex: 1;
                height: 100%;
                min-height: 0;
            }

            .conf-grid.count-2 .video-tile {
                flex: 1;
                height: calc(50% - 3px);
                min-height: 0;
            }

            .conf-grid.count-3,
            .conf-grid.count-4 {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                grid-template-rows: 1fr 1fr !important;
                gap: 6px;
            }

            .conf-grid.count-many .video-tile {
                flex: 0 0 calc(33.3% - 4px);
                min-height: 140px;
            }
        }

        /* SPOTLIGHT */
        .spotlight-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 0;
            height: 110px;
            flex-shrink: 0;
            border-top: 1px solid var(--border-subtle);
        }

        .spotlight-strip .video-tile {
            width: 150px;
            height: 100%;
            flex-shrink: 0;
        }

        .spotlight-main-slot {
            flex: 1;
            min-height: 0;
            display: flex;
            width: 100%;
            height: 100%;
        }

        .spotlight-main-slot .video-tile {
            width: 100%;
            height: 100%;
        }

        /* КАРТОЧКА ВИДЕО */
        .video-tile {
            background: var(--bg-surface);
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* ПОДСВЕТКА ГОВОРЯЩЕГО (ТОЛЬКО ДЛЯ КАМЕР) */
        .video-tile.speaking:not(.screen-tile) {
            border-color: var(--google-blue) !important;
            box-shadow: 0 0 14px rgba(168, 199, 250, 0.45) !important;
        }

        /* ДЕМОНСТРАЦИЯ ЭКРАНА — СТРОГО БЕЗ ПОДСВЕТКИ */
        .video-tile.screen-tile,
        .video-tile.screen-tile.speaking,
        div.video-tile.screen-tile {
            border: 1.5px solid rgba(255, 255, 255, 0.16) !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-tile.mirrored video {
            transform: scaleX(-1);
        }

        .video-tile.screen-tile video {
            transform: none !important;
            object-fit: contain;
        }

        /* ПОЛНОЭКРАННЫЙ РЕЖИМ (PSEUDO-FULLSCREEN) */
        .video-tile.pseudo-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            z-index: 100000 !important;
            border-radius: 0 !important;
            border: none !important;
            background: #000 !important;
        }

        /* ПЛАВАЮЩАЯ КНОПКА ЧАТА В ПОЛНОЭКРАННОМ РЕЖИМЕ (СНИЗУ СПРАВА) */
        .fullscreen-chat-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100010 !important;
            background: rgba(30, 31, 32, 0.9);
            border: 1px solid var(--border-focus);
            backdrop-filter: blur(12px);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            transition: all 0.2s ease;
        }

        .fullscreen-chat-fab:active {
            transform: scale(0.94);
        }

        /* ОВЕРЛЕИ КАРТОЧКИ */
        .tile-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            z-index: 10;
        }

        .tile-top-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            pointer-events: auto;
        }

        .tile-action-btn {
            background: rgba(19, 19, 20, 0.8);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-xs);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .tile-action-btn:hover {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border-color: var(--border-focus);
        }

        .tile-tag {
            align-self: flex-start;
            background: rgba(19, 19, 20, 0.85);
            color: var(--text-primary);
            padding: 3px 8px;
            border-radius: var(--radius-xs);
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            pointer-events: auto;
            max-width: 85%;
        }

        .hand-badge {
            background: var(--google-yellow);
            color: #000;
            border-radius: var(--radius-full);
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tile-avatar {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--google-blue);
            z-index: 2;
        }

        /* 3. НИЖНЯЯ ПАНЕЛЬ */
        .conf-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
            z-index: 25;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .studio-btn-dock {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            height: 40px;
            min-width: 40px;
            padding: 0 10px;
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .studio-btn-dock:hover {
            background: var(--bg-surface-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .studio-btn-dock.off {
            background: var(--google-red-container);
            color: var(--google-red);
            border-color: rgba(242, 139, 130, 0.4);
        }

        .studio-btn-dock.active {
            background: var(--google-blue-container);
            color: var(--google-blue);
            border-color: rgba(168, 199, 250, 0.4);
        }

        .studio-btn-dock.active-yellow {
            background: rgba(253, 214, 99, 0.16);
            color: var(--google-yellow);
            border-color: rgba(253, 214, 99, 0.4);
        }

        .studio-btn-danger {
            background: var(--google-red-container);
            color: var(--google-red);
            border-color: rgba(242, 139, 130, 0.3);
        }

        /* 4. ВСПЛЫВАЮЩИЕ УВЕДОМЛЕНИЯ СВЕРХУ (ПОВЕРХ ВСЕГО) */
        .chat-toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200000 !important;
            pointer-events: none;
            max-width: 320px;
            width: calc(100% - 32px);
        }

        .chat-floating-toast {
            background: rgba(30, 31, 32, 0.95);
            border: 1px solid var(--border-focus);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            animation: slideInDown 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .chat-floating-toast .sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--google-blue);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-floating-toast .text {
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 5. ЧАТ ПАНЕЛЬ */
        .chat-drawer {
            width: 340px;
            height: 100%;
            background: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            z-index: 150000 !important;
            position: relative;
            box-shadow: -6px 0 24px rgba(0, 0, 0, 0.6);
        }

        body.has-fullscreen .chat-drawer {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            height: 100dvh !important;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-width: 85%;
            font-size: 13px;
        }

        .chat-msg.me {
            align-self: flex-end;
        }

        .chat-msg.other {
            align-self: flex-start;
        }

        .chat-msg-sender {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .chat-msg-bubble {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            word-break: break-word;
        }

        .chat-msg.me .chat-msg-bubble {
            background: var(--google-blue-container);
            border: 1px solid rgba(168, 199, 250, 0.3);
        }

        .chat-msg.other .chat-msg-bubble {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
        }

        .chat-input-box {
            padding: 10px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 6px;
            background: var(--bg-base);
        }

        .studio-input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
        }

        .studio-input:focus {
            border-color: var(--border-focus);
        }

        /* 6. ЛОББИ */
        .lobby-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .lobby-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 760px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .lobby-preview-pane {
            padding: 24px;
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: var(--bg-base);
        }

        .lobby-settings-pane {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }

        .studio-btn-primary {
            background: var(--gemini-gradient);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .studio-btn-secondary {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* 7. ТОСТЫ И МОДАЛКИ */
        .p2p-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
            z-index: 200000 !important;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .p2p-toast.show {
            opacity: 1;
        }

        .p2p-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 180000 !important;
        }

        .studio-modal {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-select {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 10px;
            font-size: 12px;
            outline: none;
            width: 100%;
        }

        .reactions-bar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 4px 8px;
            display: flex;
            gap: 4px;
            z-index: 100;
        }

        .reaction-item-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: var(--radius-full);
        }

        .p2p-float-item {
            position: absolute;
            font-size: 32px;
            pointer-events: none;
            z-index: 300;
            animation: floatUp 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translateY(0) scale(1.1);
            }

            80% {
                opacity: 1;
                transform: translateY(-70px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-120px) scale(0.8);
            }
        }

        .p2p-hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .lobby-card {
                grid-template-columns: 1fr;
            }

            .lobby-preview-pane {
                border-right: none;

    <script>
        /* ==========================================================================
   1. СЕССИОННОЕ ХРАНИЛИЩЕ И АВТО-ПЕРЕПОДКЛЮЧЕНИЕ ПРИ F5
   ========================================================================== */
        const SESSION_KEY = 'dropconf_active_session';

        function saveSession(roomId, isHost, userName) {
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ roomId, isHost, userName, timestamp: Date.now() }));
            window.location.hash = '#' + roomId;
        }

        function clearSession() {
            sessionStorage.removeItem(SESSION_KEY);
            history.replaceState(null, '', window.location.pathname);
        }

        /* ==========================================================================
           2. ЗВУКОВОЙ ДВИЖОК И БЕЗОПАСНЫЙ VAD
           ========================================================================== */
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playChime(type = 'join') {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);

                    if (type === 'join') {
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                    } else if (type === 'leave') {
                        osc.frequency.setValueAtTime(660, now);
                        osc.frequency.exponentialRampToValueAtTime(330, now + 0.18);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                    } else if (type === 'hand') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        osc.start(now); osc.stop(now + 0.25);
                    }
                } catch (e) { }
            }
        };

        function unlockAudioOutput() {
            SoundFX.init();
            audioVAD.init();
            document.querySelectorAll('video').forEach(v => {
                if (v.id !== 'localVideo' && v.id !== 'previewVideo' && !v.id.includes('local')) {
                    v.muted = false;
                    v.volume = 1.0;
                    v.play().catch(() => { });
                }
            });
        }
        window.addEventListener('click', unlockAudioOutput, { once: true });
        window.addEventListener('touchstart', unlockAudioOutput, { once: true });
        window.addEventListener('keydown', unlockAudioOutput, { once: true });

        class AudioActivityMonitor {
            constructor() {
                this.ctx = null;
                this.monitors = new Map();
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            watch(peerId, stream, isLocal = false) {
                this.init();
                this.unwatch(peerId);
                if (!stream || !this.ctx) return;
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length === 0) return;

                try {
                    const source = this.ctx.createMediaStreamSource(stream);
                    const analyser = this.ctx.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.4;
                    source.connect(analyser);

                    const data = new Uint8Array(analyser.frequencyBinCount);
                    let isSpeaking = false;
                    let silenceTimer = null;
                    let animFrame = null;

                    const loop = () => {
                        if (!audioTracks[0] || !audioTracks[0].enabled) {
                            if (isSpeaking) {
                                isSpeaking = false;
                                this.updateSpeakerUI(peerId, false);
                            }
                            animFrame = requestAnimationFrame(loop);
                            return;
                        }

                        analyser.getByteFrequencyData(data);
                        let sum = 0;
                        for (let i = 0; i < data.length; i++) sum += data[i];
                        let avg = sum / data.length;

                        const threshold = isLocal ? 14 : 16;
                        if (avg > threshold) {
                            if (!isSpeaking) {
                                isSpeaking = true;
                                this.updateSpeakerUI(peerId, true);
                            }
                            if (silenceTimer) clearTimeout(silenceTimer);
                            silenceTimer = setTimeout(() => {
                                isSpeaking = false;
                                this.updateSpeakerUI(peerId, false);
                            }, 350);
                        }
                        animFrame = requestAnimationFrame(loop);
                    };
                    loop();

                    this.monitors.set(peerId, {
                        source,
                        cancel: () => {
                            cancelAnimationFrame(animFrame);
                            try { source.disconnect(); } catch (e) { }
                        }
                    });
                } catch (e) {
                    console.warn("[VAD] Error:", e);
                }
            }

            unwatch(peerId) {
                if (this.monitors.has(peerId)) {
                    const m = this.monitors.get(peerId);
                    m.cancel();
                    this.monitors.delete(peerId);
                    this.updateSpeakerUI(peerId, false);
                }
            }

            updateSpeakerUI(peerId, isSpeaking) {
                const tile = document.getElementById(`tile-cam-${peerId}`);
                if (tile) {
                    tile.classList.toggle('speaking', isSpeaking);
                }
                const screenTile = document.getElementById(`tile-screen-${peerId}`);
                if (screenTile) {
                    screenTile.classList.remove('speaking');
                }
            }
        }
        const audioVAD = new AudioActivityMonitor();

        /* ==========================================================================
           3. STATE & NET
           ========================================================================== */
        const net = new P2PNet({ appPrefix: 'dropconf', mode: 'mesh', debug: true });

        let myName = "User";
        let isCamOn = true;
        let isMicOn = true;
        let isScreenSharing = false;
        let isHandRaised = false;
        let currentFacingMode = 'user';
        let currentVideoDeviceId = null;
        let currentAudioDeviceId = null;
        let activeSpotlightId = null;
        let screenStream = null;

        // DOM Elements
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const toastIcon = document.getElementById('toastIcon');
        const netBadge = document.getElementById('netBadge');
        const netBadgeText = document.getElementById('netBadgeText');

        const previewTile = document.getElementById('previewTile');
        const inputUserName = document.getElementById('inputUserName');
        const inputRoomCode = document.getElementById('inputRoomCode');
        const localVideo = document.getElementById('localVideo');
        const tileCamLocal = document.getElementById('tile-cam-local');
        const myAvatar = document.getElementById('myAvatar');
        const myTagName = document.getElementById('myTagName');
        const myTagMic = document.getElementById('myTagMic');
        const myHandBadge = document.getElementById('myHandBadge');
        const videoGrid = document.getElementById('videoGrid');
        const spotlightSlot = document.getElementById('spotlightSlot');
        const spotlightStrip = document.getElementById('spotlightStrip');
        const fullscreenChatFab = document.getElementById('fullscreenChatFab');

        const btnMicToggle = document.getElementById('btnMicToggle');
        const btnCamToggle = document.getElementById('btnCamToggle');
        const btnFlipCam = document.getElementById('btnFlipCam');
        const btnScreenShare = document.getElementById('btnScreenShare');
        const btnHandRaise = document.getElementById('btnHandRaise');
        const btnReactionToggle = document.getElementById('btnReactionToggle');
        const reactionBar = document.getElementById('reactionBar');
        const btnChatToggle = document.getElementById('btnChatToggle');
        const chatPanel = document.getElementById('chatPanel');
        const chatMessages = document.getElementById('chatMessages');
        const inputChatMessage = document.getElementById('inputChatMessage');
        const chatToastContainer = document.getElementById('chatToastContainer');
        const logConsole = document.getElementById('logConsole');

        document.getElementById('btnLogToggle').onclick = () => logConsole.classList.toggle('p2p-hidden');
        function sysLog(text) {
            console.log(text);
            const time = new Date().toTimeString().split(' ')[0];
            logConsole.innerHTML = `> [${time}] ${text}<br>` + logConsole.innerHTML;
        }

        function showToast(msg, icon = 'info') {
            toastText.textContent = msg;
            toastIcon.textContent = icon;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function updateGridCount() {
            const count = videoGrid.children.length;
            videoGrid.classList.remove('count-1', 'count-2', 'count-3', 'count-4', 'count-many');

            if (count <= 1) videoGrid.classList.add('count-1');
            else if (count === 2) videoGrid.classList.add('count-2');
            else if (count === 3) videoGrid.classList.add('count-3');
            else if (count === 4) videoGrid.classList.add('count-4');
            else videoGrid.classList.add('count-many');
        }

        /* ==========================================================================
           4. ВАЛИДАЦИЯ КАМЕР И ПЕРЕКЛЮЧЕНИЕ ОБОРУДОВАНИЯ (КАК В GOOGLE MEET)
           ========================================================================== */
        function updateMirrorState() {
            const isFront = (currentFacingMode === 'user');
            if (previewTile) previewTile.classList.toggle('mirrored', isFront);
            if (tileCamLocal) tileCamLocal.classList.toggle('mirrored', isFront);
        }

        /**
         * Проверка реального поступления кадров с камеры
         */
        async function verifyVideoStream(stream, timeoutMs = 600) {
            const track = stream.getVideoTracks()[0];
            if (!track) return false;

            const testVideo = document.createElement('video');
            testVideo.muted = true;
            testVideo.playsInline = true;
            testVideo.srcObject = stream;

            try {
                await testVideo.play();
            } catch (e) {
                return false;
            }

            return new Promise((resolve) => {
                let isDone = false;
                const cleanup = (res) => {
                    if (isDone) return;
                    isDone = true;
                    testVideo.pause();
                    testVideo.srcObject = null;
                    resolve(res);
                };

                const timer = setTimeout(() => cleanup(false), timeoutMs);

                if ('requestVideoFrameCallback' in testVideo) {
                    testVideo.requestVideoFrameCallback(() => {
                        clearTimeout(timer);
                        cleanup(testVideo.videoWidth > 0);
                    });
                } else {
                    testVideo.onloadedmetadata = () => {
                        if (testVideo.videoWidth > 0) {
                            clearTimeout(timer);
                            cleanup(true);
                        }
                    };
                }
            });
        }

        /**
         * Интеллектуальный захват аудио и видео с автоматическим обходом нерабочих сенсоров
         */
        async function getSafeUserMedia(facingMode = 'user', audioSourceId = null, videoSourceId = null) {
            const audioConstraints = {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                ...(audioSourceId ? { deviceId: { exact: audioSourceId } } : {})
            };

            // 1. Если указан конкретный deviceId
            if (videoSourceId) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: videoSourceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: audioConstraints
                    });
                    const isWorking = await verifyVideoStream(stream);
                    if (isWorking) {
                        currentVideoDeviceId = videoSourceId;
                        return stream;
                    }
                    stream.getTracks().forEach(t => t.stop());
                    sysLog("Камера " + videoSourceId + " не дает кадров. Поиск альтернативы...");
                } catch (e) { }
            }

            // 2. Семантический захват по facingMode (выбирает главную рабочую камеру ОС)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: audioConstraints
                });
                const isWorking = await verifyVideoStream(stream);
                if (isWorking) {
                    const track = stream.getVideoTracks()[0];
                    const settings = track.getSettings();
                    if (settings.deviceId) currentVideoDeviceId = settings.deviceId;
                    return stream;
                }
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { }

            // 3. Fallback: перебор всех доступных видеоустройств
            let devices = [];
            try { devices = await navigator.mediaDevices.enumerateDevices(); } catch (e) { }
            const videoDevs = devices.filter(d => d.kind === 'videoinput');

            for (const dev of videoDevs) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: dev.deviceId } },
                        audio: audioConstraints
                    });
                    const ok = await verifyVideoStream(stream);
                    if (ok) {
                        currentVideoDeviceId = dev.deviceId;
                        return stream;
                    }
                    stream.getTracks().forEach(t => t.stop());
                } catch (err) { }
            }

            // 4. Финальный аварийный запрос только базового аудио/видео
            return await navigator.mediaDevices.getUserMedia({ video: true, audio: audioConstraints });
        }

        async function initPreview() {
            try {
                const stream = await getSafeUserMedia(currentFacingMode);
                net.localStream = stream;
                previewVideo.srcObject = stream;
                localVideo.srcObject = stream;

                previewVideo.muted = true;
                localVideo.muted = true;

                await previewVideo.play().catch(() => { });
                await localVideo.play().catch(() => { });

                audioVAD.watch('local', stream, true);
                updateMirrorState();
            } catch (e) {
                sysLog("Ошибка инициализации медиа: " + e.message);
                isCamOn = false; isMicOn = false;
                previewAvatar.style.display = 'flex';
                myAvatar.style.display = 'flex';
                btnCamToggle.classList.add('off');
                btnMicToggle.classList.add('off');
            }
        }

        /**
         * Переключение фронтальной / тыловой камеры
         */
        async function flipCamera() {
            const nextMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            showToast("Переключение камеры...", 'sync');

            try {
                const newStream = await getSafeUserMedia(nextMode, currentAudioDeviceId, null);
                const oldVideoTrack = net.localStream ? net.localStream.getVideoTracks()[0] : null;
                const newVideoTrack = newStream.getVideoTracks()[0];

                currentFacingMode = nextMode;
                updateMirrorState();

                if (net.localStream) {
                    if (oldVideoTrack) {
                        net.localStream.removeTrack(oldVideoTrack);
                        oldVideoTrack.stop();
                    }
                    net.localStream.addTrack(newVideoTrack);
                } else {
                    net.localStream = newStream;
                }

                localVideo.srcObject = net.localStream;
                previewVideo.srcObject = net.localStream;
                localVideo.play().catch(() => { });
                previewVideo.play().catch(() => { });

                // Подменяем трек в активных WebRTC-соединениях
                await net.replaceTrack(newVideoTrack, 'video');

                // Если камера была выключена — активируем
                newVideoTrack.enabled = isCamOn;
                net.broadcast({ type: 'CAM_STATUS', isCamOn: isCamOn });

                showToast(currentFacingMode === 'user' ? "Фронтальная камера" : "Основная камера", 'flip_camera_ios');
            } catch (err) {
                showToast("Ошибка переключения камеры: " + err.message, 'error');
            }
        }

        btnFlipCam.onclick = flipCamera;
        document.getElementById('btnFlipCamPreview').onclick = flipCamera;

        /**
         * Быстрое включение/выключение камеры (через enabled без разрушения соединения)
         */
        function toggleCamera() {
            if (!net.localStream) return;
            const videoTrack = net.localStream.getVideoTracks()[0];

            if (isCamOn) {
                if (videoTrack) videoTrack.enabled = false;
                isCamOn = false;
                myAvatar.style.display = 'flex';
                previewAvatar.style.display = 'flex';
                btnCamToggle.classList.add('off');
                btnCamToggle.innerHTML = '<span class="material-symbols-outlined">videocam_off</span>';
                net.broadcast({ type: 'CAM_STATUS', isCamOn: false });
            } else {
                if (videoTrack) videoTrack.enabled = true;
                isCamOn = true;
                myAvatar.style.display = 'none';
                previewAvatar.style.display = 'none';
                btnCamToggle.classList.remove('off');
                btnCamToggle.innerHTML = '<span class="material-symbols-outlined">videocam</span>';
                net.broadcast({ type: 'CAM_STATUS', isCamOn: true });
            }
        }

        /**
         * Быстрое включение/выключение микрофона (через enabled)
         */
        function toggleMicrophone() {
            if (!net.localStream) return;
            const audioTrack = net.localStream.getAudioTracks()[0];

            if (isMicOn) {
                if (audioTrack) audioTrack.enabled = false;
                isMicOn = false;
                myTagMic.textContent = 'mic_off';
                myTagMic.style.color = 'var(--google-red)';
                btnMicToggle.classList.add('off');
                btnMicToggle.innerHTML = '<span class="material-symbols-outlined">mic_off</span>';
                document.getElementById('btnTogglePreviewMic').innerHTML = '<span class="material-symbols-outlined">mic_off</span> Off';
                net.broadcast({ type: 'MIC_STATUS', isMicOn: false });
            } else {
                if (audioTrack) audioTrack.enabled = true;
                isMicOn = true;
                myTagMic.textContent = 'mic';
                myTagMic.style.color = 'var(--google-green)';
                btnMicToggle.classList.remove('off');
                btnMicToggle.innerHTML = '<span class="material-symbols-outlined">mic</span>';
                document.getElementById('btnTogglePreviewMic').innerHTML = '<span class="material-symbols-outlined">mic</span> Mic';
                net.broadcast({ type: 'MIC_STATUS', isMicOn: true });
            }
        }

        btnCamToggle.onclick = toggleCamera;
        btnMicToggle.onclick = toggleMicrophone;
        document.getElementById('btnTogglePreviewCam').onclick = toggleCamera;
        document.getElementById('btnTogglePreviewMic').onclick = toggleMicrophone;

        /* ==========================================================================
           5. ГОРЯЧИЕ КЛАВИШИ
           ========================================================================== */
        let spacePressed = false;
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space' && !spacePressed) {
                spacePressed = true;
                if (!isMicOn) toggleMicrophone();
            } else if (e.key.toLowerCase() === 'm') {
                toggleMicrophone();
            } else if (e.key.toLowerCase() === 'v') {
                toggleCamera();
            } else if (e.key.toLowerCase() === 'h') {
                toggleHandRaise();
            } else if (e.key.toLowerCase() === 'c') {
                toggleChat();
            } else if (e.key === 'Escape') {
                exitAllFullscreens();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && spacePressed) {
                spacePressed = false;
                if (isMicOn) toggleMicrophone();
            }
        });

        /* ==========================================================================
           6. РУКА И ДЕМОНСТРАЦИЯ ЭКРАНА
           ========================================================================== */
        function toggleHandRaise() {
            isHandRaised = !isHandRaised;
            btnHandRaise.classList.toggle('active-yellow', isHandRaised);
            myHandBadge.classList.toggle('p2p-hidden', !isHandRaised);

            if (isHandRaised) SoundFX.playChime('hand');
            net.broadcast({ type: 'HAND_RAISE', isRaised: isHandRaised, name: myName });
        }
        btnHandRaise.onclick = toggleHandRaise;

        async function toggleScreenShare() {
            if (isScreenSharing) {
                stopScreenShare();
            } else {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    return showToast("Экран не поддерживается вашим браузером", 'error');
                }

                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: true });
                    isScreenSharing = true;
                    btnScreenShare.classList.add('active');
                    btnScreenShare.innerHTML = '<span class="material-symbols-outlined">stop_screen_share</span>';

                    addOrUpdateScreenTile('local', screenStream, `${myName} (Экран)`, true);
                    net.startScreenShare(screenStream, myName);

                    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
                } catch (err) {
                    if (err.name !== 'NotAllowedError') showToast("Ошибка экрана: " + err.message, 'error');
                }
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            isScreenSharing = false;
            btnScreenShare.classList.remove('active');
            btnScreenShare.innerHTML = '<span class="material-symbols-outlined">present_to_all</span>';
            removeTile('tile-screen-local');
            net.stopScreenShare();
        }
        btnScreenShare.onclick = toggleScreenShare;

        /* ==========================================================================
           7. УПРАВЛЕНИЕ КАРТОЧКАМИ, SPOTLIGHT И FULLSCREEN
           ========================================================================== */
        function addOrUpdateCamTile(peerId, stream, participantName) {
            const tileId = `tile-cam-${peerId}`;
            let tile = document.getElementById(tileId);

            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'video-tile';
                tile.id = tileId;
                tile.innerHTML = `
            <video id="video-cam-${peerId}" autoplay playsinline webkit-playsinline></video>
            <div id="avatar-cam-${peerId}" class="tile-avatar" style="display:none;">
                <span class="material-symbols-outlined" style="font-size:32px;">person</span>
            </div>
            <div class="tile-overlay">
                <div class="tile-top-actions">
                    <div class="hand-badge p2p-hidden" id="hand-${peerId}">✋ Рука</div>
                    <button class="tile-action-btn" title="Закрепить" onclick="toggleSpotlight('${tileId}')">
                        <span class="material-symbols-outlined">keep</span>
                    </button>
                    <button class="tile-action-btn" title="На весь экран" onclick="toggleNativeFullscreen('${tileId}')">
                        <span class="material-symbols-outlined">fullscreen</span>
                    </button>
                </div>
                <div class="tile-tag">
                    <span id="mic-cam-${peerId}" class="material-symbols-outlined" style="font-size:14px; color:var(--google-green);">mic</span>
                    <span>${participantName || 'Участник'}</span>
                </div>
            </div>
        `;
                appendTileProperly(tile);
                SoundFX.playChime('join');
            }

            const videoEl = document.getElementById(`video-cam-${peerId}`);
            if (videoEl && stream) {
                videoEl.srcObject = stream;
                videoEl.muted = false;
                videoEl.volume = 1.0;
                videoEl.play().catch(() => { });
                audioVAD.watch(peerId, stream, false);
            }
            updateGridCount();
        }

        function addOrUpdateScreenTile(peerId, stream, titleName, isLocal = false) {
            const tileId = `tile-screen-${peerId}`;
            let tile = document.getElementById(tileId);

            if (!tile) {
                tile = document.createElement('div');
                tile.className = 'video-tile screen-tile';
                tile.id = tileId;
                tile.innerHTML = `
            <video id="video-screen-${peerId}" autoplay playsinline webkit-playsinline ${isLocal ? 'muted' : ''}></video>
            <div class="tile-overlay">
                <div class="tile-top-actions">
                    <button class="tile-action-btn" title="Закрепить" onclick="toggleSpotlight('${tileId}')">
                        <span class="material-symbols-outlined">keep</span>
                    </button>
                    <button class="tile-action-btn" title="На весь экран" onclick="toggleNativeFullscreen('${tileId}')">
                        <span class="material-symbols-outlined">fullscreen</span>
                    </button>
                </div>
                <div class="tile-tag" style="border-color: rgba(168, 199, 250, 0.4);">
                    <span class="material-symbols-outlined" style="font-size:14px; color:var(--google-blue);">screen_share</span>
                    <span>${titleName || 'Экран'}</span>
                </div>
            </div>
        `;
                appendTileProperly(tile);
            }

            const videoEl = document.getElementById(`video-screen-${peerId}`);
            if (videoEl && stream) {
                videoEl.srcObject = stream;
                if (!isLocal) {
                    videoEl.muted = false;
                    videoEl.volume = 1.0;
                }
                videoEl.play().catch(() => { });
            }
            updateGridCount();
        }

        function appendTileProperly(tile) {
            if (activeSpotlightId) {
                spotlightStrip.appendChild(tile);
            } else {
                videoGrid.appendChild(tile);
            }
        }

        function removeTile(tileId) {
            const tile = document.getElementById(tileId);
            if (!tile) return;
            if (activeSpotlightId === tileId) toggleSpotlight(tileId);

            const pId = tileId.replace('tile-cam-', '').replace('tile-screen-', '');
            audioVAD.unwatch(pId);

            tile.remove();
            updateGridCount();
            SoundFX.playChime('leave');
        }

        window.toggleSpotlight = function (tileId) {
            const tile = document.getElementById(tileId);
            if (!tile) return;

            if (activeSpotlightId === tileId) {
                spotlightSlot.innerHTML = '';
                spotlightSlot.classList.add('p2p-hidden');
                spotlightStrip.classList.add('p2p-hidden');

                const stripTiles = Array.from(spotlightStrip.children);
                stripTiles.forEach(t => videoGrid.appendChild(t));
                videoGrid.appendChild(tile);
                videoGrid.classList.remove('p2p-hidden');
                activeSpotlightId = null;
            } else {
                if (activeSpotlightId) {
                    const prev = document.getElementById(activeSpotlightId);
                    if (prev) spotlightStrip.appendChild(prev);
                }

                const allTiles = Array.from(videoGrid.children);
                allTiles.forEach(t => {
                    if (t.id !== tileId) spotlightStrip.appendChild(t);
                });

                videoGrid.classList.add('p2p-hidden');
                spotlightSlot.innerHTML = '';
                spotlightSlot.appendChild(tile);

                spotlightSlot.classList.remove('p2p-hidden');
                spotlightStrip.classList.remove('p2p-hidden');
                activeSpotlightId = tileId;
            }
            updateGridCount();
        };

        window.toggleNativeFullscreen = function (tileId) {
            const tile = document.getElementById(tileId);
            if (!tile) return;

            if (tile.classList.contains('pseudo-fullscreen')) {
                exitAllFullscreens();
            } else {
                document.querySelectorAll('.pseudo-fullscreen').forEach(el => el.classList.remove('pseudo-fullscreen'));
                tile.classList.add('pseudo-fullscreen');
                document.body.classList.add('has-fullscreen');
                fullscreenChatFab.classList.remove('p2p-hidden');
            }
        };

        function exitAllFullscreens() {
            document.querySelectorAll('.pseudo-fullscreen').forEach(el => el.classList.remove('pseudo-fullscreen'));
            document.body.classList.remove('has-fullscreen');
            fullscreenChatFab.classList.add('p2p-hidden');
        }

        /* ==========================================================================
           8. НАСТРОЙКИ ОБОРУДОВАНИЯ
           ========================================================================== */
        const settingsModal = document.getElementById('settingsModal');
        const selectVideoInput = document.getElementById('selectVideoInput');
        const selectAudioInput = document.getElementById('selectAudioInput');
        const selectAudioOutput = document.getElementById('selectAudioOutput');

        document.getElementById('btnSettingsOpen').onclick = async () => {
            const devices = await navigator.mediaDevices.enumerateDevices();
            selectVideoInput.innerHTML = '';
            selectAudioInput.innerHTML = '';
            selectAudioOutput.innerHTML = '';

            devices.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `${d.kind} (${d.deviceId.slice(0, 5)}...)`;

                if (d.kind === 'videoinput') {
                    if (d.deviceId === currentVideoDeviceId) opt.selected = true;
                    selectVideoInput.appendChild(opt);
                } else if (d.kind === 'audioinput') {
                    if (d.deviceId === currentAudioDeviceId) opt.selected = true;
                    selectAudioInput.appendChild(opt);
                } else if (d.kind === 'audiooutput') {
                    selectAudioOutput.appendChild(opt);
                }
            });

            settingsModal.classList.remove('p2p-hidden');
        };

        document.getElementById('btnCloseSettings').onclick = () => settingsModal.classList.add('p2p-hidden');

        document.getElementById('btnSaveSettings').onclick = async () => {
            const audioId = selectAudioInput.value;
            const videoId = selectVideoInput.value;
            settingsModal.classList.add('p2p-hidden');

            try {
                const newStream = await getSafeUserMedia(currentFacingMode, audioId, videoId);
                currentAudioDeviceId = audioId;
                currentVideoDeviceId = videoId;

                const oldVTrack = net.localStream ? net.localStream.getVideoTracks()[0] : null;
                const oldATrack = net.localStream ? net.localStream.getAudioTracks()[0] : null;

                const newVTrack = newStream.getVideoTracks()[0];
                const newATrack = newStream.getAudioTracks()[0];

                if (net.localStream) {
                    if (oldVTrack) { net.localStream.removeTrack(oldVTrack); oldVTrack.stop(); }
                    if (oldATrack) { net.localStream.removeTrack(oldATrack); oldATrack.stop(); }
                    if (newVTrack) net.localStream.addTrack(newVTrack);
                    if (newATrack) net.localStream.addTrack(newATrack);
                } else {
                    net.localStream = newStream;
                }

                localVideo.srcObject = net.localStream;
                previewVideo.srcObject = net.localStream;

                if (newVTrack) {
                    newVTrack.enabled = isCamOn;
                    await net.replaceTrack(newVTrack, 'video');
                }
                if (newATrack) {
                    newATrack.enabled = isMicOn;
                    await net.replaceTrack(newATrack, 'audio');
                    audioVAD.watch('local', net.localStream, true);
                }

                showToast("Оборудование успешно обновлено", 'check_circle');
            } catch (e) {
                showToast("Ошибка смены оборудования: " + e.message, 'error');
            }
        };

        /* ==========================================================================
           9. ПОДКЛЮЧЕНИЕ / ВЫХОД / СЕССИЯ
           ========================================================================== */
        document.getElementById('btnCreateRoom').onclick = async () => {
            prepareJoin();
            try {
                const code = await net.createRoom();
                setRoomStatus(code);
                saveSession(code, true, myName);
                showToast("Сессия создана", 'check_circle');
            } catch (err) {
                alert("Ошибка: " + err.message);
                leaveConference();
            }
        };

        document.getElementById('btnJoinRoom').onclick = () => {
            const code = inputRoomCode.value.trim();
            if (code.length < 3) return showToast("Введите код сессии", 'warning');
            prepareJoin();
            net.joinRoom(code, { name: myName }).then(() => {
                setRoomStatus(code);
                saveSession(code, false, myName);
            }).catch(err => {
                alert("Не удалось подключиться: " + err.message);
                leaveConference();
            });
        };

        function prepareJoin() {
            myName = inputUserName.value.trim() || ("User-" + Math.floor(Math.random() * 900 + 100));
            myTagName.textContent = myName + " (Вы)";
            lobbyScreen.classList.add('p2p-hidden');
            conferenceScreen.classList.remove('p2p-hidden');
            updateMirrorState();
            updateGridCount();
        }

        function setRoomStatus(code) {
            netBadge.className = "studio-badge online";
            netBadgeText.textContent = `ROOM: ${code}`;
        }

        function leaveConference() {
            clearSession();
            exitAllFullscreens();
            if (activeSpotlightId) toggleSpotlight(activeSpotlightId);
            stopScreenShare();

            const tiles = document.querySelectorAll('.video-tile:not(#tile-cam-local)');
            tiles.forEach(t => t.remove());

            net.destroy(true);

            conferenceScreen.classList.add('p2p-hidden');
            lobbyScreen.classList.remove('p2p-hidden');
            netBadge.className = "studio-badge";
            netBadgeText.textContent = "STANDBY";

        }
        document.getElementById('btnLeaveCall').onclick = leaveConference;

        /* ==========================================================================
           10. СОБЫТИЯ СЕТИ И ВСПЛЫВАЮЩИЙ ЧАТ
           ========================================================================== */
        net.on('status', ({ online, reconnecting }) => {
            if (reconnecting) {
                netBadge.className = "studio-badge reconnecting";
                netBadgeText.textContent = "RECONNECTING";
                showToast("Переподключение к сети...", 'sync');
            } else if (online) {
                if (net.roomId) setRoomStatus(net.roomId);
                else {
                    netBadge.className = "studio-badge online";
                    netBadgeText.textContent = "ONLINE";
                }
            } else {
                netBadge.className = "studio-badge";
                netBadgeText.textContent = "OFFLINE";
            }
        });

        net.on('remote-stream', ({ peerId, stream, metadata }) => {
            if (metadata?.type === 'screen') {
                addOrUpdateScreenTile(peerId, stream, `${metadata.name || 'Участник'} (Экран)`);
            } else {
                addOrUpdateCamTile(peerId, stream, metadata?.name);
            }
        });

        net.on('peer-disconnected', ({ peerId }) => {
            removeTile(`tile-cam-${peerId}`);
            removeTile(`tile-screen-${peerId}`);
        });

        net.on('data', (data, senderPeerId) => {
            if (data.type === 'CHAT_MSG') {
                appendChatMessage(data.name, data.text, false);
                if (chatPanel.classList.contains('p2p-hidden')) {
                    showFloatingChatToast(data.name, data.text);
                }
            } else if (data.type === 'REACTION') {
                spawnFloatingReaction(data.emoji);
            } else if (data.type === 'HAND_RAISE') {
                const handEl = document.getElementById(`hand-${senderPeerId}`);
                if (handEl) handEl.classList.toggle('p2p-hidden', !data.isRaised);
                if (data.isRaised) {
                    SoundFX.playChime('hand');
                    showToast(`${data.name || 'Участник'} поднял(а) руку ✋`, 'back_hand');
                }
            } else if (data.type === 'MIC_STATUS') {
                const micEl = document.getElementById(`mic-cam-${senderPeerId}`);
                if (micEl) {
                    micEl.textContent = data.isMicOn ? 'mic' : 'mic_off';
                    micEl.style.color = data.isMicOn ? 'var(--google-green)' : 'var(--google-red)';
                }
            } else if (data.type === 'CAM_STATUS') {
                const vid = document.getElementById(`video-cam-${senderPeerId}`);
                const avt = document.getElementById(`avatar-cam-${senderPeerId}`);
                if (vid && avt) {
                    vid.style.display = data.isCamOn ? 'block' : 'none';
                    avt.style.display = data.isCamOn ? 'none' : 'flex';
                }
            } else if (data.type === 'SCREEN_STOPPED') {
                removeTile(`tile-screen-${senderPeerId}`);
            }
        });

        /* ==========================================================================
           11. ЧАТ, РЕАКЦИИ И ПЛАВАЮЩИЕ УВЕДОМЛЕНИЯ СВЕРХУ
           ========================================================================== */
        function showFloatingChatToast(sender, text) {
            const toastEl = document.createElement('div');
            toastEl.className = 'chat-floating-toast';
            toastEl.innerHTML = `
        <div class="sender">
            <span class="material-symbols-outlined" style="font-size: 14px;">chat</span>
            ${escapeHtml(sender)}
        </div>
        <div class="text">${escapeHtml(text)}</div>
    `;

            toastEl.onclick = () => {
                toggleChat(true);
                toastEl.remove();
            };

            chatToastContainer.appendChild(toastEl);
            setTimeout(() => {
                toastEl.style.opacity = '0';
                toastEl.style.transform = 'translateY(-10px)';
                setTimeout(() => toastEl.remove(), 300);
            }, 4500);
        }

        function toggleChat(forceOpen = null) {
            if (forceOpen === true) {
                chatPanel.classList.remove('p2p-hidden');
            } else {
                chatPanel.classList.toggle('p2p-hidden');
            }
            if (!chatPanel.classList.contains('p2p-hidden')) {
                chatToastContainer.innerHTML = '';
            }
        }
        window.toggleChat = toggleChat;

        btnReactionToggle.onclick = () => reactionBar.classList.toggle('p2p-hidden');
        document.querySelectorAll('.reaction-item-btn').forEach(btn => {
            btn.onclick = () => {
                const emoji = btn.dataset.emoji;
                spawnFloatingReaction(emoji);
                net.broadcast({ type: 'REACTION', emoji });
                reactionBar.classList.add('p2p-hidden');
            };
        });

        function spawnFloatingReaction(emoji) {
            const el = document.createElement('div');
            el.className = 'p2p-float-item';
            el.textContent = emoji;
            el.style.left = (Math.random() * 60 + 20) + '%';
            document.getElementById('reactionContainer').appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }

        btnChatToggle.onclick = () => toggleChat();
        document.getElementById('btnCloseChat').onclick = () => chatPanel.classList.add('p2p-hidden');
        document.getElementById('btnSendChat').onclick = sendChatMessage;
        inputChatMessage.onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage(); };

        function sendChatMessage() {
            const text = inputChatMessage.value.trim();
            if (!text) return;
            appendChatMessage("You", text, true);
            net.broadcast({ type: 'CHAT_MSG', name: myName, text });
            inputChatMessage.value = '';
        }

        function appendChatMessage(sender, text, isMe) {
            const msgEl = document.createElement('div');
            msgEl.className = `chat-msg ${isMe ? 'me' : 'other'}`;
            msgEl.innerHTML = `
        <div class="chat-msg-sender">${sender}</div>
        <div class="chat-msg-bubble">${escapeHtml(text)}</div>
    `;
            chatMessages.appendChild(msgEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.getElementById('btnInviteInfo').onclick = () => {
            document.getElementById('modalRoomCode').textContent = net.roomId;
            const qrEl = document.getElementById('modalQrCode'); qrEl.innerHTML = "";
            new QRCode(qrEl, { text: net.getShareUrl(), width: 130, height: 130, colorDark: "#131314", colorLight: "#ffffff" });
            document.getElementById('inviteModal').classList.remove('p2p-hidden');
        };
        document.getElementById('btnCloseInviteModal').onclick = () => document.getElementById('inviteModal').classList.add('p2p-hidden');
        document.getElementById('btnCopyInviteLink').onclick = () => {
            navigator.clipboard.writeText(net.getShareUrl()).then(() => showToast("Ссылка скопирована", 'content_copy'));
        };

        /* ==========================================================================
           12. ИНИЦИАЛИЗАЦИЯ И ВОССТАНОВЛЕНИЕ СЕССИИ
           ========================================================================== */
        async function checkAutoReconnect() {
            const raw = sessionStorage.getItem(SESSION_KEY);
            const hash = window.location.hash.substring(1).trim();
            let session = null;
            try { session = JSON.parse(raw); } catch (e) { }

            if (session && session.roomId) {
                const code = P2PNet.cleanCode(session.roomId);
                inputUserName.value = session.userName || '';
                myName = session.userName || 'User';
                prepareJoin();
                showToast(`Восстановление сессии ${code}...`, 'sync');

                try {
                    await initPreview();
                    if (session.isHost) {
                        await net.createRoom(code);
                    } else {
                        await net.joinRoom(code, { name: myName });
                    }
                    setRoomStatus(code);
                    showToast("Сессия восстановлена", 'check_circle');
                } catch (err) {
                    sysLog("Авто-реконнект не удался: " + err.message);
                    clearSession();
                    leaveConference();
                }
            } else if (hash.length >= 3) {
                inputRoomCode.value = P2PNet.cleanCode(hash);
                await initPreview();
            } else {
                await initPreview();
            }
        }

        window.addEventListener('load', checkAutoReconnect);
    </script>
</body>

</html>
